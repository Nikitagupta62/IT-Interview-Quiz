    <div style="display:flex;align-items:center;gap:14px;">
      <span class="topic-best">${allBest? 'best <b>'+allBest.score+'/'+allBest.total+'</b>' : ''}</span>
      <span class="chev">→</span>
    </div>`;
  allRow.onclick = ()=>{ state.topicKey = ALL_TOPICS; renderConfig(); show('config'); };
  list.appendChild(allRow);

  Object.keys(subj.topics).forEach(tk=>{
    const topic = subj.topics[tk];
    const best = getBest(state.subjectKey, tk);
    const row = document.createElement('button');
    row.className = 'topic-row';
    row.style.setProperty('--card-accent', subj.accent);
    row.innerHTML = `<div class="topic-left"><span class="topic-dot"></span><div><div class="topic-name">${topic.name}</div><div class="topic-count mono">${topic.qs.length} questions in pool</div></div></div>
      <div style="display:flex;align-items:center;gap:14px;">
        <span class="topic-best">${best? 'best <b>'+best.score+'/'+best.total+'</b>' : ''}</span>
        <span class="chev">→</span>
      </div>`;
    row.onclick = ()=>{ state.topicKey = tk; renderConfig(); show('config'); };
    list.appendChild(row);
  });
}

function renderConfig(){
  const subj = BANK[state.subjectKey];
  const pool = getTopicPool(state.subjectKey, state.topicKey);
  const topicName = getTopicName(state.subjectKey, state.topicKey);
  document.getElementById('configTitle').textContent = topicName;
  document.getElementById('configSub').textContent = subj.name + ' · pool of ' + pool.length + ' questions, randomized and shuffled each attempt.';

  const maxQ = pool.length;
  const numOptions = computeNumOptions(maxQ);
  if(!numOptions.includes(state.numQ)) state.numQ = numOptions[Math.min(1, numOptions.length-1)];
  const numRow = document.getElementById('numRow');
  numRow.innerHTML = '';
  numOptions.forEach(n=>{
    const b = document.createElement('button');
    b.className = 'opt-btn' + (state.numQ===n?' active':'');
    b.style.setProperty('--card-accent', subj.accent);
    b.textContent = n===maxQ? n+' (all)': n;
    b.onclick = ()=>{ state.numQ = n; renderConfig(); };
    numRow.appendChild(b);
  });

  const timeRow = document.getElementById('timeRow');
  timeRow.innerHTML = '';
  [10,15,20,30].forEach(s=>{
    const b = document.createElement('button');
    b.className = 'opt-btn' + (state.secPerQ===s?' active':'');
    b.style.setProperty('--card-accent', subj.accent);
    b.textContent = s+'s';
    b.onclick = ()=>{ state.secPerQ = s; renderConfig(); };
    timeRow.appendChild(b);
  });

  const startBtn = document.getElementById('startBtn');
  startBtn.style.setProperty('--card-accent', subj.accent);
  startBtn.onclick = startQuiz;
}

let endConfirming = false;
let endConfirmTimeout = null;

function endQuizEarly(){
  const btn = document.getElementById('endQuizBtn');
  if(!btn) return;
  if(!endConfirming){
    endConfirming = true;
    btn.textContent = 'tap again to confirm';
    btn.classList.add('confirm');
    clearTimeout(endConfirmTimeout);
    endConfirmTimeout = setTimeout(()=>{
      endConfirming = false;
      btn.textContent = 'end quiz ✕';
      btn.classList.remove('confirm');
    }, 3000);
    return;
  }
  clearTimeout(endConfirmTimeout);
  endConfirming = false;
  clearInterval(state.timer);
  renderResults();
}

function resetEndQuizBtn(){
  endConfirming = false;
  clearTimeout(endConfirmTimeout);
  const btn = document.getElementById('endQuizBtn');
  if(btn){ btn.textContent = 'end quiz ✕'; btn.classList.remove('confirm'); }
}

function startQuiz(){
  state.quiz = buildQuiz(state.subjectKey, state.topicKey, state.numQ);
  state.idx = 0;
  state.score = 0;
  state.answers = [];
  state.startedAt = Date.now();
  show('quiz');
  renderQuestion();
}

function renderQuestion(){
  resetEndQuizBtn();
  const subj = BANK[state.subjectKey];
  const q = state.quiz[state.idx];
  document.getElementById('qProgress').textContent = 'Q '+(state.idx+1)+'/'+state.quiz.length;
  document.getElementById('qScore').textContent = 'score '+state.score;
  document.getElementById('qText').textContent = q.q;
  document.getElementById('qExp').classList.add('hidden');
  document.getElementById('nextRow').classList.add('hidden');

  const optWrap = document.getElementById('qOptions');
  optWrap.innerHTML = '';
  const letters = ['A','B','C','D'];
  q.options.forEach((opt,i)=>{
    const b = document.createElement('button');
    b.className = 'option';
    b.style.setProperty('--card-accent', subj.accent);
    b.innerHTML = `<span class="tag mono">${letters[i]}</span><span>${opt}</span>`;
    b.onclick = ()=> lockAnswer(i);
    optWrap.appendChild(b);
  });

  state.timeLeft = state.secPerQ;
  updateTimerBar(subj.accent);
  clearInterval(state.timer);
  state.timer = setInterval(()=>{
    state.timeLeft -= 1;
    updateTimerBar(subj.accent);
    if(state.timeLeft<=0){
      clearInterval(state.timer);
      lockAnswer(-1);
    }
  },1000);
}

function updateTimerBar(accent){
  const fill = document.getElementById('timerFill');
  const pct = Math.max(0, (state.timeLeft/state.secPerQ)*100);
  fill.style.width = pct+'%';
  fill.classList.toggle('warn', state.timeLeft<=Math.ceil(state.secPerQ*0.3));
}

function lockAnswer(choiceIdx){
  clearInterval(state.timer);
  const q = state.quiz[state.idx];
  const correct = choiceIdx===q.answer;
  if(correct) state.score += 1;
  state.answers.push({q:q.q, chosen:choiceIdx, correct:q.answer, isCorrect:correct, options:q.options, exp:q.exp});

  const opts = document.querySelectorAll('#qOptions .option');
  opts.forEach((el,i)=>{
    el.classList.add('locked');
    el.onclick = null;
    if(i===q.answer) el.classList.add('correct');
    else if(i===choiceIdx) el.classList.add('wrong');
  });
  const expEl = document.getElementById('qExp');
  expEl.textContent = (choiceIdx===-1? "Time's up — " : '') + q.exp;
  expEl.classList.remove('hidden');
  document.getElementById('qScore').textContent = 'score '+state.score;

  const nextRow = document.getElementById('nextRow');
  nextRow.classList.remove('hidden');
  const nextBtn = document.getElementById('nextBtn');
  nextBtn.textContent = (state.idx===state.quiz.length-1)? 'see results →' : 'next →';
  nextBtn.onclick = ()=>{
    state.idx += 1;
    if(state.idx >= state.quiz.length) renderResults();
    else renderQuestion();
  };
}

function renderResults(){
  show('results');
  clearInterval(state.timer);
  const subj = BANK[state.subjectKey];
  const total = state.answers.length;
  const endedEarly = total < state.quiz.length;
  document.getElementById('resScore').style.color = subj.accent;

  if(total === 0){
    document.getElementById('resScore').textContent = '—';
    document.getElementById('resTotal').textContent = 'quiz ended, no questions answered';
    document.getElementById('resTag').textContent = 'No score to show this time — jump back in whenever you are ready.';
    document.getElementById('resBest').innerHTML = '';
    document.getElementById('review').innerHTML = '';
    document.getElementById('retryBtn').onclick = startQuiz;
    document.getElementById('backBtn').onclick = ()=>{ renderTopics(); show('topics'); };
    return;
  }

  document.getElementById('resScore').textContent = state.score;
  document.getElementById('resTotal').textContent = 'out of '+total+(endedEarly? ' (ended early)':'');
  const pct = Math.round((state.score/total)*100);
  let tag = 'Keep practicing — repetition builds recall.';
  if(pct>=90) tag = "Excellent — that's near mastery on this topic.";
  else if(pct>=70) tag = 'Solid grasp — a couple more rounds to lock it in.';
  else if(pct>=50) tag = 'Decent start — review the misses below.';
  document.getElementById('resTag').textContent = tag+' ('+pct+'%)'+(endedEarly? ' · quiz ended early':'');

  const isNewBest = setBest(state.subjectKey, state.topicKey, state.score, total);
  const best = getBest(state.subjectKey, state.topicKey);
  document.getElementById('resBest').innerHTML = best? `<div class="best-badge">${isNewBest? 'new best · ':'best · '}${best.score}/${best.total}</div>` : '';

  const review = document.getElementById('review');
  review.innerHTML = '';
  const letters = ['A','B','C','D'];
  state.answers.forEach((a,i)=>{
    const div = document.createElement('div');
    div.className = 'rev-item';
    const yourAns = a.chosen===-1? 'no answer (time out)' : letters[a.chosen]+'. '+a.options[a.chosen];
    div.innerHTML = `<div class="rev-q">${i+1}. ${a.q}</div>
      <div class="rev-line ${a.isCorrect?'ok':'bad'}">your answer: ${yourAns}</div>
      ${a.isCorrect? '' : `<div class="rev-line ok">correct: ${letters[a.correct]}. ${a.options[a.correct]}</div>`}`;
    review.appendChild(div);
  });

  const retryBtn = document.getElementById('retryBtn');
  retryBtn.style.background = subj.accent;
  retryBtn.onclick = startQuiz;
  document.getElementById('backBtn').onclick = ()=>{ renderTopics(); show('topics'); };
}

/* init */
renderHome();
show('home');
</script>
</body>
</html>
