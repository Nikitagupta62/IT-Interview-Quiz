{q:"The ALL operator with a subquery returns true if:",o:["The condition holds for at least one value","The condition holds for every value returned by the subquery","The subquery is empty","It behaves like ANY"],a:1,e:"Every value returned by the subquery must satisfy the comparison for ALL to be true."},
{q:"Can a subquery be nested within another subquery?",o:["No, SQL disallows this","Yes, nested subqueries are allowed in most SQL implementations","Only up to one level","Only in NoSQL databases"],a:1,e:"Multiple levels of nesting are generally supported, though readability can suffer."},
{q:"For large datasets, which is generally more efficient: a well-indexed JOIN or a correlated subquery re-evaluated per row?",o:["The correlated subquery is always faster","A JOIN is often more efficient since it avoids repeated re-execution","They always perform identically","Correlated subqueries eliminate the need for indexes"],a:1,e:"Correlated subqueries can be expensive because they may execute once per outer row."},
{q:"UNION ALL differs from UNION in that it:",o:["Removes duplicate rows","Does not remove duplicate rows, which can make it faster","Requires fewer columns","Only works with numeric columns"],a:1,e:"Skipping the deduplication step avoids the overhead of sorting/comparing for duplicates."},
{q:"For a UNION to work correctly, the combined queries must have:",o:["Identical table names","The same number of columns with compatible data types","The same WHERE clause","No ORDER BY clause"],a:1,e:"Column counts and compatible types are required to merge the result sets meaningfully."},
{q:"A Common Table Expression (CTE), defined using WITH, is primarily used to:",o:["Permanently store data","Make complex queries more readable by naming a temporary result set","Replace all subqueries with joins","Enforce constraints"],a:1,e:"CTEs let you break a complex query into named, referenceable building blocks."}
 ]},
 keys_constraints:{name:"Keys & Constraints", qs:[
  {q:"A primary key must be:",o:["Unique and allow NULLs","Unique and NOT NULL","Non-unique but indexed","Any data type only"],a:1,e:"A primary key uniquely identifies each row and can never be NULL."},
  {q:"A foreign key:",o:["Must be unique in its own table","References a primary key in another (or the same) table","Cannot reference another table","Is always the primary key too"],a:1,e:"It enforces a link between rows in two tables, maintaining referential integrity."},
  {q:"A UNIQUE constraint:",o:["Allows duplicate non-null values","Disallows duplicate non-null values (commonly allows one NULL)","Is the same as NOT NULL","Can only be applied to primary keys"],a:1,e:"It ensures no two rows share the same non-null value in that column."},
  {q:"A NOT NULL constraint:",o:["Requires a column to always have a value","Allows unlimited NULLs","Applies only to primary keys","Is the default for all columns"],a:0,e:"It disallows NULL entries for that column."},
  {q:"A composite key is:",o:["A key made of a single column","A primary key made up of multiple columns together","A foreign key without constraints","A duplicate of another key"],a:1,e:"Multiple columns together uniquely identify a row when no single column can."},
  {q:"A CHECK constraint is used to:",o:["Enforce a condition on the values allowed in a column","Automatically back up a table","Join two tables","Sort query results"],a:0,e:"For example, CHECK (age >= 18) rejects rows that violate the condition."},
  {q:"A candidate key is:",o:["Any column that happens to be indexed","A column (or set of columns) that could qualify as the primary key","A foreign key only","A column with duplicate values"],a:1,e:"Multiple candidate keys may exist; one is chosen as the primary key."},
  {q:"A DEFAULT constraint:",o:["Forces a column to be unique","Provides a default value when none is specified on insert","Deletes rows automatically","Prevents updates"],a:1,e:"If no value is given for that column, the default is used instead."}
 ,
{q:"Can a single table have more than one UNIQUE constraint?",o:["No, only one is allowed per table","Yes, on different columns or column combinations","Only if there's no primary key","Only in NoSQL databases"],a:1,e:"Multiple UNIQUE constraints can coexist, each enforcing uniqueness on its own column set."},
{q:"A surrogate key is:",o:["A key derived from real business data","An artificially generated key (like an auto-increment ID) with no inherent business meaning","Always a foreign key","The same as a candidate key"],a:1,e:"Surrogate keys are introduced purely for identification, independent of the data's meaning."},
{q:"A natural key is:",o:["An automatically generated identifier","A key derived from existing business/domain data, like an email address or SSN","Always numeric","Never unique"],a:1,e:"It's meaningful data that could naturally identify a row, unlike a surrogate key."},
{q:"Referential integrity in a relational database is enforced by:",o:["Indexes","Foreign key constraints","Views","Triggers only"],a:1,e:"Foreign keys ensure that references between tables remain valid and consistent."},
{q:"By default, what happens if you try to delete a row that is referenced by a foreign key in another table?",o:["The row is deleted along with all related rows automatically","The delete is typically rejected unless cascading rules are defined","Nothing happens, the reference silently breaks","The database crashes"],a:1,e:"Databases prevent orphaned references unless explicit cascade behavior is configured."},
{q:"ON DELETE CASCADE means:",o:["Deleting a child row deletes the parent","Deleting the parent row automatically deletes related child rows","Deletes are always blocked","It disables foreign keys"],a:1,e:"This cascading rule propagates deletions to maintain referential integrity automatically."},
{q:"A self-referencing foreign key is used when:",o:["A table has no relationships","A table references its own primary key, like an employee's manager_id pointing to another employee","Two unrelated tables are joined","A column must always be NULL"],a:1,e:"This models hierarchical relationships within a single table."},
{q:"Can a primary key column also technically have a UNIQUE constraint declared separately?",o:["No, it would cause an error","Yes, though it's redundant since primary keys already enforce uniqueness","Only in older SQL standards","Only for composite keys"],a:1,e:"Primary keys are inherently unique and not null, making an additional explicit UNIQUE constraint unnecessary but harmless."}
 ]},
 indexes_views:{name:"Indexes & Views", qs:[
  {q:"An index primarily improves:",o:["Insert speed only","Query read/search performance","Disk space usage","Data type accuracy"],a:1,e:"Indexes let the database find rows without scanning the entire table."},
  {q:"A downside of having too many indexes is:",o:["Faster reads always","Slower insert/update/delete operations","Smaller table size","No downside exists"],a:1,e:"Every index must also be updated whenever the underlying data changes, adding overhead."},
  {q:"A view is:",o:["A physical copy of a table","A virtual table based on a stored query","A type of index","A backup mechanism"],a:1,e:"Views present query results as if they were a table, without storing the data separately (unless materialized)."},
  {q:"A clustered index determines:",o:["Nothing about storage","The physical order of data rows in the table","Only the column names","The number of foreign keys"],a:1,e:"Because it defines physical order, a table can have only one clustered index."},
  {q:"A materialized view:",o:["Is recomputed on every query with no storage","Stores the query result physically for faster access","Cannot be indexed","Is identical to a regular view in every way"],a:1,e:"It trades storage and staleness for faster read performance since results are precomputed."},
  {q:"A composite index is built on:",o:["Exactly one column always","More than one column together","No columns","Only primary keys"],a:1,e:"It speeds up queries that filter or sort on the combination of those columns."},
  {q:"Views can be used to:",o:["Simplify complex queries and restrict access to certain data","Replace all tables","Prevent any querying","Automatically delete old rows"],a:0,e:"They provide a simplified or restricted interface over underlying tables."},
  {q:"Indexes are commonly implemented internally using a:",o:["Linked list","B-tree (or similar balanced tree structure)","Stack","Simple array only"],a:1,e:"B-trees (and variants like B+ trees) keep lookups efficient at O(log n)."}
 ,
{q:"A non-clustered index stores:",o:["The actual data rows in index order","A separate structure with pointers back to the actual data rows","No pointers at all","Only column names"],a:1,e:"Unlike a clustered index, it doesn't dictate the physical row order of the table itself."},
{q:"Can a table have multiple non-clustered indexes?",o:["No, only one is allowed","Yes, typically many non-clustered indexes are allowed","Only two maximum","Only if there's no primary key"],a:1,e:"Databases generally allow several non-clustered indexes to support different query patterns."},
{q:"An updatable view allows:",o:["Only SELECT operations","Performing INSERT/UPDATE/DELETE through the view under certain conditions","No querying at all","Only aggregate queries"],a:1,e:"Simple views based on a single table without aggregation are often updatable."},
{q:"A covering index is one that:",o:["Covers the entire database","Contains all the columns needed to satisfy a query without accessing the underlying table","Only covers primary keys","Cannot be used for SELECT queries"],a:1,e:"Because the index itself has everything needed, the database can skip a costly lookup of the full row."},
{q:"Index fragmentation occurs when:",o:["An index is deleted","Ongoing data changes cause the index's physical order to become inefficient over time","A table has too few indexes","Queries run too fast"],a:1,e:"Frequent inserts/updates/deletes can scatter index entries, degrading performance until it's rebuilt or reorganized."},
{q:"A full-text index is specialized for:",o:["Sorting numeric columns","Efficient searching within large text columns for words or phrases","Enforcing uniqueness","Speeding up joins only"],a:1,e:"It supports natural-language style search queries that a normal B-tree index handles poorly."},
{q:"Views can help improve security by:",o:["Exposing the entire underlying schema","Exposing only specific columns or rows to certain users","Disabling all access controls","Removing the need for permissions entirely"],a:1,e:"A view can present a restricted, filtered slice of the data to users without direct table access."},
{q:"Rebuilding or reorganizing an index is typically done to:",o:["Delete unused data","Improve performance by reducing fragmentation","Add new columns to a table","Change the primary key"],a:1,e:"Maintenance operations restore a more efficient physical layout for faster lookups."}
 ]}
}},
dbms:{name:"DBMS", accent:"#5fd68a", snippet:"BEGIN TRANSACTION;", topics:{
 er_keys:{name:"ER Model", qs:[
  {q:"An entity in an ER diagram represents:",o:["A relationship only","A real-world object or concept","A SQL command","A stored procedure"],a:1,e:"Entities are the 'things' being modeled, like Student or Product."},
  {q:"A relationship in ER modeling represents:",o:["An attribute of an entity","An association between two or more entities","A primary key","A data type"],a:1,e:"Relationships describe how entities are connected, e.g. 'Student enrolls in Course'."},
  {q:"Cardinality in an ER model describes:",o:["The size of the database","The number of instances of one entity related to another","The number of tables","The color of the diagram"],a:1,e:"It expresses relationships like one-to-one, one-to-many, or many-to-many."},
  {q:"A weak entity:",o:["Can be uniquely identified without any other entity","Depends on another (owner) entity for its identification","Has no attributes","Cannot participate in relationships"],a:1,e:"A weak entity relies on a foreign key from its owner entity to be uniquely identified."},
  {q:"An attribute that can be broken down into smaller sub-parts is called:",o:["A derived attribute","A composite attribute","A multivalued attribute","A key attribute"],a:1,e:"For example, 'Address' can be split into street, city, and zip code."},
  {q:"A multivalued attribute:",o:["Can hold multiple values for a single entity instance","Can only hold one value","Is always a key","Cannot be stored in a database"],a:0,e:"For example, a person might have multiple phone numbers."},
  {q:"A derived attribute:",o:["Is stored directly and never changes","Can be computed from other attributes","Must always be a primary key","Cannot exist in ER models"],a:1,e:"For example, 'Age' can be derived from a stored 'Date of Birth'."},
  {q:"Converting an ER diagram into database tables is called:",o:["Denormalization","Schema/relational mapping","Query optimization","Indexing"],a:1,e:"This process translates entities and relationships into relational tables."}
 ,
{q:"A binary relationship in ER modeling involves:",o:["A single entity","Exactly two entities","Three entities","Any number of entities"],a:1,e:"Binary relationships connect exactly two entity types, like Student and Course."},
{q:"A ternary relationship in ER modeling involves:",o:["Two entities","Three entities","Only weak entities","No entities"],a:1,e:"It captures an association among three different entity types simultaneously."},
{q:"Total participation in an ER diagram means:",o:["Some instances may skip the relationship","Every instance of that entity must participate in the relationship","No instances participate","Only weak entities participate"],a:1,e:"It's shown with a double line, indicating mandatory participation for every entity instance."},
{q:"Partial participation means:",o:["Every instance must participate","Some instances of an entity may not participate in the relationship","The relationship is invalid","It's the same as total participation"],a:1,e:"Participation is optional; not every entity instance needs to be involved."},
{q:"A recursive relationship is one where:",o:["Two different entities relate to each other","An entity is related to itself","No relationship exists","A relationship has no attributes"],a:1,e:"An example is an 'employee supervises employee' relationship within the same Employee entity."},
{q:"Generalization in ER modeling refers to:",o:["Splitting one entity into many","Combining lower-level entities into a higher-level, more general entity","Deleting redundant entities","Adding more attributes to an entity"],a:1,e:"It abstracts common features of several entities into a shared higher-level entity."},
{q:"Specialization in ER modeling refers to:",o:["Merging entities together","Dividing a higher-level entity into lower-level, more specific entities","Removing attributes","Combining relationships"],a:1,e:"It's the inverse of generalization, creating subtypes with specialized attributes."},
{q:"Aggregation in ER modeling is used to:",o:["Delete relationships","Treat a relationship (and its participating entities) as a higher-level entity","Combine two databases","Sort entities alphabetically"],a:1,e:"This lets a relationship itself participate in further relationships, as if it were an entity."},
{q:"An Enhanced ER (EER) diagram adds support for concepts like:",o:["Only basic entities and attributes","Generalization, specialization, and inheritance among entities","SQL syntax","Physical storage details"],a:1,e:"EER extends the classic ER model with object-oriented-like concepts."}
 ]},
 normalization:{name:"Normalization", qs:[
  {q:"The main goal of normalization is to:",o:["Increase data redundancy","Reduce data redundancy and improve data integrity","Slow down queries intentionally","Remove all keys"],a:1,e:"Normalization organizes data to minimize duplication and update anomalies."},
  {q:"First Normal Form (1NF) requires:",o:["Composite keys only","Atomic (indivisible) column values, no repeating groups","No foreign keys","Denormalized tables"],a:1,e:"Each column must hold a single, indivisible value per row."},
  {q:"Second Normal Form (2NF) removes:",o:["Transitive dependency","Partial dependency on a composite primary key","All foreign keys","Multivalued attributes"],a:1,e:"2NF ensures non-key attributes depend on the whole composite key, not just part of it."},
  {q:"Third Normal Form (3NF) removes:",o:["Partial dependency","Transitive dependency","Atomicity violations","Primary keys"],a:1,e:"3NF ensures non-key attributes depend only on the primary key, not on other non-key attributes."},
  {q:"BCNF (Boyce-Codd Normal Form) is:",o:["Weaker than 3NF","A stronger version of 3NF","Unrelated to normalization","The same as 1NF"],a:1,e:"BCNF handles certain edge cases involving overlapping candidate keys that 3NF doesn't fully address."},
  {q:"Denormalization is done to:",o:["Increase redundancy for better write performance always","Improve read performance at the cost of some redundancy","Remove all relationships","Enforce stricter integrity"],a:1,e:"It's a deliberate trade-off, often used in reporting/analytics systems for faster reads."},
  {q:"A functional dependency A → B means:",o:["A and B are unrelated","B's value is determined by A's value","A is a foreign key","B must be a primary key"],a:1,e:"Given a value of A, the value of B is uniquely determined."},
  {q:"A table that is NOT in 1NF may contain:",o:["Only atomic values","Repeating groups or multi-valued fields","A single primary key","Perfectly normalized data"],a:1,e:"Violating 1NF often means a column stores multiple values instead of one."}
 ,
{q:"Fourth Normal Form (4NF) primarily deals with:",o:["Atomic values","Multivalued dependencies","Transitive dependencies","Partial dependencies"],a:1,e:"4NF eliminates redundancy caused by independent multivalued facts about an entity."},
{q:"Fifth Normal Form (5NF), or Project-Join Normal Form, deals with:",o:["Partial dependencies","Join dependencies","Atomicity","Foreign keys"],a:1,e:"It addresses redundancy that arises from certain join dependencies not implied by candidate keys."},
{q:"A partial dependency exists when:",o:["A non-key attribute depends on the whole primary key","A non-key attribute depends on only part of a composite primary key","No dependencies exist","Every attribute is a key"],a:1,e:"2NF specifically targets and removes this kind of dependency."},
{q:"A transitive dependency exists when:",o:["A non-key attribute depends directly on the primary key","A non-key attribute depends on another non-key attribute rather than directly on the key","Two keys reference each other","There is no primary key"],a:1,e:"3NF removes this indirect dependency chain."},
{q:"Which normal form is typically considered sufficient for most practical database designs?",o:["1NF","2NF","3NF or BCNF","5NF always"],a:2,e:"Most real-world schemas stop at 3NF or BCNF, balancing integrity with query simplicity."},
{q:"A consequence of normalization is that it can lead to:",o:["Fewer tables and simpler queries","More tables and the need for more joins in queries","Guaranteed faster reads always","No storage savings"],a:1,e:"Splitting data to reduce redundancy often requires combining tables back together via joins."},
{q:"An anomaly where deleting a row unintentionally removes other still-needed information is called:",o:["An insertion anomaly","A deletion anomaly","An update anomaly","A join anomaly"],a:1,e:"Poorly normalized tables can bundle unrelated facts, so deleting one fact loses another."},
{q:"An anomaly where you cannot insert certain data because unrelated required data is missing is called:",o:["A deletion anomaly","An insertion anomaly","An update anomaly","A read anomaly"],a:1,e:"This often happens when a table forces unrelated attributes to be entered together."},
{q:"An anomaly where updating a piece of data requires changing it in multiple places is called:",o:["A deletion anomaly","An insertion anomaly","An update anomaly","A key anomaly"],a:2,e:"Redundant storage of the same fact across rows creates the risk of inconsistent updates."}
 ]},
 transactions_acid:{name:"Transactions & ACID", qs:[
  {q:"ACID stands for:",o:["Atomicity, Consistency, Isolation, Durability","Access, Control, Index, Data","Atomic, Concurrent, Indexed, Distributed","Aggregate, Commit, Insert, Delete"],a:0,e:"These four properties guarantee reliable transaction processing."},
  {q:"Atomicity ensures that a transaction is:",o:["Partially applied if it fails","All-or-nothing — fully completed or fully rolled back","Always slow","Split across multiple databases"],a:1,e:"Either every operation in the transaction succeeds, or none of them take effect."},
  {q:"Durability ensures that:",o:["Committed changes are lost on crash","Committed changes persist even after a system crash","Transactions never commit","Data is always encrypted"],a:1,e:"Once committed, the changes survive power failures or crashes."},
  {q:"Isolation ensures that:",o:["Transactions must run one at a time only","Concurrent transactions don't interfere with each other incorrectly","Data is never shared","Only one user can access the database"],a:1,e:"Each transaction behaves as if it's the only one running, even with concurrency."},
  {q:"If a transaction fails partway through, it should be:",o:["Committed anyway","Rolled back to undo partial changes","Ignored","Automatically retried forever"],a:1,e:"Rolling back preserves atomicity by undoing incomplete work."},
  {q:"COMMIT in SQL:",o:["Undoes all changes","Saves all changes made in the transaction permanently","Deletes the table","Locks the database"],a:1,e:"It finalizes the transaction's changes, making them visible and durable."},
  {q:"ROLLBACK:",o:["Permanently saves changes","Undoes changes made in the current transaction","Creates a new table","Indexes a column"],a:1,e:"It reverts the database to its state before the transaction began."},
  {q:"Consistency in ACID ensures that:",o:["The database can end up in an invalid state","A transaction moves the database from one valid state to another","Queries run faster","Indexes are rebuilt automatically"],a:1,e:"All defined rules and constraints must hold before and after the transaction."}
 ,
{q:"A transaction generally begins with a BEGIN (or implicit start) and ends with:",o:["Only COMMIT","COMMIT or ROLLBACK","SELECT","CREATE TABLE"],a:1,e:"A transaction concludes either by committing its changes or rolling them back."},
{q:"The default isolation level in many relational databases (though it varies) is often:",o:["SERIALIZABLE","READ COMMITTED","READ UNCOMMITTED","REPEATABLE READ always"],a:1,e:"Many systems default to READ COMMITTED as a balance between consistency and concurrency, though this varies by database."},
{q:"A phantom read occurs when:",o:["A transaction reads uncommitted data","A transaction re-runs a query and finds new rows that now match the condition, inserted by another transaction","A transaction reads the same unchanged row twice","No transactions are running"],a:1,e:"New rows appearing between repeated reads within the same transaction are 'phantoms'."},
{q:"A non-repeatable read occurs when:",o:["A transaction cannot read any data","A transaction reads the same row twice and gets different values because another transaction modified it in between","A transaction never commits","Data is permanently deleted"],a:1,e:"The value of an existing row changes between two reads within the same transaction."},
{q:"The REPEATABLE READ isolation level prevents:",o:["Nothing at all","Dirty reads and non-repeatable reads, though it may still allow phantom reads","All possible anomalies always","Only phantom reads"],a:1,e:"It guarantees the same rows return consistent values, though new rows might still appear."},
{q:"The READ UNCOMMITTED isolation level allows:",o:["No anomalies at all","Dirty reads","Only phantom reads","Serializable behavior"],a:1,e:"It's the weakest isolation level, permitting transactions to see uncommitted changes from others."},
{q:"A savepoint within a transaction allows:",o:["Committing only part of a transaction permanently","Rolling back to a specific point within the transaction without undoing everything","Starting a completely new transaction","Ignoring the ACID properties"],a:1,e:"Savepoints give finer-grained control over partial rollbacks within a larger transaction."},
{q:"The 'durability' property of ACID is typically implemented using:",o:["In-memory caching only","Transaction logs written to persistent storage","Temporary tables","Application-level retries"],a:1,e:"Logging changes to durable storage ensures committed data survives crashes."},
{q:"A distributed transaction spanning multiple databases often relies on:",o:["A single local commit","A two-phase commit protocol","No coordination at all","Only READ UNCOMMITTED isolation"],a:1,e:"Two-phase commit coordinates all participants to either all commit or all abort consistently."}
 ]},
 concurrency:{name:"Concurrency Control", qs:[
  {q:"A deadlock occurs when:",o:["One transaction runs alone","Two or more transactions wait on each other indefinitely for locks","A transaction commits successfully","An index is rebuilt"],a:1,e:"Each transaction holds a resource the other needs, so neither can proceed."},
  {q:"Two-phase locking (2PL) consists of:",o:["Only a growing phase","A growing phase (acquiring locks) and a shrinking phase (releasing locks)","Only a shrinking phase","No locking at all"],a:1,e:"Locks are acquired first, then released, and never re-acquired after releasing begins."},
  {q:"A dirty read happens when:",o:["A transaction reads only committed data","A transaction reads uncommitted data from another transaction","No transactions are running","Data is permanently lost"],a:1,e:"If the other transaction later rolls back, the read data was never actually valid."},
  {q:"The Serializable isolation level:",o:["Provides the weakest isolation","Provides the strongest isolation, preventing most anomalies","Allows dirty reads freely","Disables transactions"],a:1,e:"It ensures transactions behave as if executed one after another, in some serial order."},
  {q:"A lost update anomaly occurs when:",o:["A transaction never completes","Two transactions overwrite each other's changes, losing one update","Data is backed up twice","An index is dropped"],a:1,e:"Without proper locking, concurrent writes can silently discard one transaction's changes."},
  {q:"Optimistic concurrency control assumes:",o:["Conflicts are frequent and locks everything upfront","Conflicts are rare and checks for them only at commit time","No transactions ever conflict","Locking is unnecessary entirely"],a:1,e:"It avoids locking overhead by validating for conflicts just before committing."},
  {q:"A shared lock allows:",o:["Only one transaction to read or write","Multiple transactions to read, but none to write","Unlimited writes from any transaction","No access at all"],a:1,e:"Shared locks permit concurrent reads while blocking writes."},
  {q:"An exclusive lock allows:",o:["Multiple simultaneous writers","Only one transaction to read or write at a time on that resource","Unlimited concurrent readers","Nothing — it blocks all access"],a:1,e:"It gives one transaction sole access, blocking both reads and writes by others."}
 ,
{q:"Starvation in concurrency control occurs when:",o:["A transaction always gets resources quickly","A transaction is perpetually denied the resources it needs, often due to unfair scheduling","Two transactions deadlock","A transaction commits instantly"],a:1,e:"Even without a deadlock, a transaction can be repeatedly passed over indefinitely."},
{q:"A timestamp-based concurrency control protocol works by:",o:["Ignoring the order of transactions","Ordering transactions based on their timestamps to ensure a serializable schedule","Locking every resource permanently","Random scheduling"],a:1,e:"Conflicts are resolved based on which transaction has an earlier or later timestamp."},
{q:"Multiversion Concurrency Control (MVCC) works by:",o:["Locking all rows during any read","Keeping multiple versions of data so readers don't block writers (and vice versa)","Disabling concurrent transactions entirely","Deleting old data immediately"],a:1,e:"Readers see a consistent snapshot while writers create new versions, reducing contention."},
{q:"A 'wait-die' deadlock prevention scheme:",o:["Kills the older transaction always","Allows an older transaction to wait for a younger one, but aborts a younger transaction requesting a lock held by an older one","Prevents all waiting entirely","Applies only to read-only transactions"],a:1,e:"Older (lower timestamp) transactions are prioritized to proceed, aborting younger conflicting ones."},
{q:"A 'wound-wait' deadlock prevention scheme:",o:["Never aborts any transaction","Allows an older transaction to force ('wound') a younger transaction to abort if it holds a needed lock","Only works with two transactions","Always favors the younger transaction"],a:1,e:"It's the mirror strategy of wait-die, again resolving conflicts based on timestamp order."},
{q:"Deadlock detection commonly uses:",o:["A sorted array of transactions","A wait-for graph to identify cycles among waiting transactions","A hash table of locks only","Random sampling"],a:1,e:"A cycle in the wait-for graph indicates a deadlock among the involved transactions."},
{q:"Once a deadlock is detected, a common recovery approach is to:",o:["Ignore it and continue","Roll back one or more transactions involved in the cycle to break it","Restart the entire database","Wait indefinitely"],a:1,e:"Aborting a victim transaction releases its locks, allowing the others to proceed."},
{q:"Livelock differs from deadlock in that:",o:["Processes are completely frozen","Processes keep changing state in response to each other without making real progress, rather than being blocked","It never actually occurs in practice","It only affects single-threaded programs"],a:1,e:"In a livelock, transactions remain 'active' but keep yielding to each other without completing."},
{q:"The granularity of locking (table-level vs. row-level) affects:",o:["Nothing meaningful","The trade-off between concurrency (more granular = more concurrency) and locking overhead","Only the database's storage engine choice","Whether ACID properties apply"],a:1,e:"Finer-grained locks allow more concurrent access but require more bookkeeping overhead."}
 ]},
 indexing_storage:{name:"Indexing & File Organization", qs:[
  {q:"In a B+ tree index, actual data records are stored:",o:["In internal nodes only","Only in leaf nodes","Nowhere — B+ trees don't store data","Randomly across all nodes"],a:1,e:"Internal nodes only guide the search; leaf nodes hold (or point to) the actual data."},
  {q:"Hashing-based indexing is most efficient for:",o:["Range queries","Equality lookups","Sorting large datasets","Full table scans"],a:1,e:"Hash indexes map keys directly to locations, ideal for exact-match lookups but not ranges."},
  {q:"Sequential file organization stores records:",o:["In random order","In a sorted physical order based on a key","Only in memory","As unstructured blobs"],a:1,e:"Records are physically ordered, which speeds up range-based access."},
  {q:"Heap file organization stores records:",o:["In sorted order","Without any particular physical order","Only as indexes","In a single fixed location"],a:1,e:"New records are simply appended wherever space is available."},
  {q:"A primary index is built on:",o:["Any non-key column","The primary key of a sequentially ordered file","A randomly chosen column","Only foreign keys"],a:1,e:"It's created on the ordering key field of a sorted data file."},
  {q:"A secondary index is built on:",o:["The primary key only","A non-key or non-ordering field","No field at all","The table name"],a:1,e:"It provides fast access via fields other than the file's main ordering key."},
  {q:"A clustering index groups:",o:["Unrelated records together randomly","Records with the same value physically together","Only unique records","Deleted records"],a:1,e:"It's used on non-key fields to physically co-locate records sharing that value."},
  {q:"The main purpose of indexing is to:",o:["Increase storage requirements only","Speed up data retrieval","Slow down write operations intentionally","Replace primary keys"],a:1,e:"Indexes trade some storage and write overhead for much faster reads."}
 ,
{q:"A dense index contains:",o:["One entry for only some search key values","One index entry for every search key value in the data file","No entries at all","Entries only for duplicate keys"],a:1,e:"Every distinct search key value present in the data file has a corresponding index entry."},
{q:"A sparse index contains:",o:["An entry for every record","Index entries for only some of the search key values, such as one per data block","No structure at all","Only foreign key values"],a:1,e:"It trades some lookup precision for a smaller index size, relying on sequential scanning within a block."},
{q:"A multilevel index is used to:",o:["Increase the number of disk accesses needed","Reduce the number of disk accesses needed for large indexes by building an index over the index","Eliminate the need for any index","Only work with in-memory databases"],a:1,e:"Multiple levels create a tree-like structure that narrows the search efficiently, similar to a B-tree."},
{q:"Fixed-length record storage makes locating a specific record by position:",o:["Impossible","Straightforward, via direct calculation of its byte offset","Only possible through a full scan","Dependent on an index always"],a:1,e:"Since every record occupies the same fixed size, its offset can be computed directly."},
{q:"Variable-length record storage typically requires:",o:["No additional structures","Additional structures like offsets, length fields, or delimiters to locate records","Fixed-size blocks only","Removal of all indexes"],a:1,e:"Because records differ in size, extra metadata is needed to know where each one starts and ends."},
{q:"A bitmap index is especially efficient for columns with:",o:["High cardinality (many distinct values)","Low cardinality (few distinct values), like a gender or status flag","No values at all","Only numeric primary keys"],a:1,e:"Bitmaps compactly represent the presence/absence of a small set of possible values."},
{q:"Buffer/cache management in a DBMS is primarily used to:",o:["Permanently store all data in memory","Reduce disk I/O by keeping frequently accessed data pages in memory","Compress data on disk","Enforce access control"],a:1,e:"Caching hot pages avoids the much higher cost of repeated disk reads."},
{q:"The 'page' or 'block' is the basic unit of:",o:["SQL query syntax","Data transfer between disk and memory in a DBMS","User authentication","Index compression only"],a:1,e:"Databases read and write data in fixed-size pages rather than individual bytes."}
 ]},
 recovery_misc:{name:"Recovery & Fundamentals", qs:[
  {q:"Write-Ahead Logging (WAL) ensures:",o:["Data changes are applied before being logged","Log records are written before the corresponding data changes are applied","Logs are never written","Transactions skip logging entirely"],a:1,e:"This lets the system recover consistently by replaying or undoing logged changes after a crash."},
  {q:"A checkpoint in recovery is used to:",o:["Delete all logs","Mark a consistent point to reduce recovery time after a crash","Slow down transactions permanently","Remove indexes"],a:1,e:"Recovery only needs to process logs after the last checkpoint, not from the very beginning."},
  {q:"Shadow paging is a recovery technique that:",o:["Uses copies of pages instead of a log for recovery","Requires no memory","Is identical to WAL","Only works for read-only databases"],a:0,e:"Changes are made to a shadow copy of pages, which becomes current only on commit."},
  {q:"A Database Administrator (DBA) is primarily responsible for:",o:["Writing application UI code","Managing and maintaining the database system","Designing marketing materials","Writing device drivers"],a:1,e:"DBAs handle schema design, security, performance tuning, backups, and more."},
  {q:"Data independence means:",o:["Applications must change whenever storage structure changes","Applications are largely unaffected by changes in storage or schema details","Data cannot be modified once written","Every application needs its own database copy"],a:1,e:"It separates the logical view of data from its physical storage implementation."},
  {q:"A schema defines:",o:["The actual data values stored","The structure/design of the database","A single query","A backup file"],a:1,e:"The schema describes tables, columns, types, and relationships — not the data itself."},
  {q:"DDL (Data Definition Language) includes commands like:",o:["SELECT, INSERT, UPDATE","CREATE, ALTER, DROP","COMMIT, ROLLBACK","GRANT, REVOKE only"],a:1,e:"DDL commands define or modify the structure of database objects."},
  {q:"DML (Data Manipulation Language) includes commands like:",o:["CREATE, DROP","SELECT, INSERT, UPDATE, DELETE","GRANT, REVOKE","ALTER, TRUNCATE"],a:1,e:"DML commands work with the actual data stored within the defined structures."}
 ,
{q:"A rollback segment (or undo log) is used to:",o:["Permanently delete committed data","Store information needed to undo the effects of uncommitted transactions","Speed up SELECT queries","Replace indexes"],a:1,e:"If a transaction aborts, the undo log restores the prior state of affected data."},
{q:"The redo log in recovery is used to:",o:["Undo uncommitted changes","Reapply committed changes that weren't yet flushed to disk before a crash","Delete old transaction records","Enforce foreign keys"],a:1,e:"It ensures durability by letting the system recover committed work lost from memory during a crash."},
{q:"A typical three-tier database application architecture consists of:",o:["Only a database and a client","Presentation, application/logic, and data layers","Only front-end code","A single monolithic layer"],a:1,e:"Separating concerns into these layers improves maintainability and scalability."},
{q:"Which SQL language component lets you control access rights, using commands like GRANT and REVOKE?",o:["DDL","DML","DCL (Data Control Language)","TCL"],a:2,e:"DCL manages permissions and security-related access to database objects."},
{q:"TCL (Transaction Control Language) includes commands like:",o:["CREATE, ALTER, DROP","SELECT, INSERT, UPDATE","COMMIT, ROLLBACK, SAVEPOINT","GRANT, REVOKE"],a:2,e:"These commands manage the lifecycle and boundaries of transactions."},
{q:"A stored procedure is:",o:["A single ad-hoc query","A precompiled set of SQL statements stored and executed on the database server","A type of index","A view with no logic"],a:1,e:"It can encapsulate business logic and be invoked repeatedly with parameters."},
{q:"A trigger is:",o:["A manually run report","A piece of code automatically executed in response to certain database events like INSERT, UPDATE, or DELETE","A type of primary key","A backup schedule"],a:1,e:"Triggers enforce rules or automate actions tied directly to data changes."},
{q:"Database replication is used to:",o:["Delete redundant data","Maintain copies of data across multiple servers for availability, fault tolerance, and load distribution","Normalize a database automatically","Enforce ACID properties only"],a:1,e:"Replicas help systems stay available and can distribute read load across servers."}
 ]}
}},
python:{name:"Python", accent:"#ffd166", snippet:"def solve(x):", topics:{
 basics_types:{name:"Basics & Data Types", qs:[
  {q:"Python is best described as:",o:["A statically typed, compiled language","A dynamically typed, interpreted language","Only usable for web development","A markup language"],a:1,e:"Types are checked at runtime, and code runs through an interpreter rather than being compiled to machine code upfront."},
  {q:"Which of these Python types is immutable?",o:["list","dict","tuple","set"],a:2,e:"Once created, a tuple's contents cannot be changed."},
  {q:"type(3.14) in Python returns:",o:["int","float","str","double"],a:1,e:"Numbers with a decimal point are represented as the float type."},
  {q:"Which operator performs floor division in Python?",o:["/","//","%","**"],a:1,e:"// divides and rounds down to the nearest whole number."},

  {q:"In Python, indentation is used to:",o:["Add comments","Define code blocks (instead of braces)","Improve performance only","Declare variable types"],a:1,e:"Python uses consistent indentation to delimit blocks like loops, functions, and conditionals."},
  {q:"The id() function in Python returns:",o:["The value of a variable","The memory address / identity of an object","The data type as a string","The length of an object"],a:1,e:"It gives a unique identifier for the object during its lifetime."},
  {q:"Which syntax is commonly used for multi-line strings or docstrings?",o:["Single quotes","Triple quotes","Hash symbols","Angle brackets"],a:1,e:"Triple quotes ('''...''' or \"\"\"...\"\"\") let a string span multiple lines."}
 ,
{q:"Which of these is a mutable built-in type in Python?",o:["tuple","str","list","frozenset"],a:2,e:"Lists can be modified in place after creation, unlike tuples, strings, or frozensets."},
{q:"The // operator with negative numbers in Python rounds:",o:["Towards zero","Towards positive infinity","Towards negative infinity (floor)","Randomly"],a:2,e:"Python's floor division always rounds down, even for negative results, e.g. -7 // 2 equals -4."},
{q:"What does the 'is' operator check in Python?",o:["Whether two objects are equal in value","Whether two references point to the exact same object (identity)","Whether a variable is defined","Whether a value is truthy"],a:1,e:"'is' compares object identity (memory location), not value equality."},
{q:"What does '==' check in Python?",o:["Object identity","Whether two objects are equal in value","Type compatibility only","Memory address equality"],a:1,e:"'==' invokes the __eq__ method to compare values, which can be customized for objects."},
{q:"Which built-in function returns the number of items in a container?",o:["count()","size()","len()","length()"],a:2,e:"len() works on strings, lists, tuples, dicts, sets, and other sized containers."},
{q:"Python variables are best described as:",o:["Fixed memory boxes holding a value","Names bound to objects (references)","Always statically typed slots","Pointers that must be manually freed"],a:1,e:"A variable name is a reference to an object; reassigning a name doesn't change other references to that object."},
{q:"What is the result type of 5 / 2 in Python 3?",o:["int","float","str","complex"],a:1,e:"The true division operator '/' always returns a float in Python 3."},

{q:"What does Python's indentation-based syntax primarily replace, compared to languages like C or Java?",o:["Semicolons","Curly braces for defining code blocks","Variable declarations","Comments"],a:1,e:"Consistent indentation delimits blocks instead of explicit brace characters."},
{q:"Which built-in function returns a string describing an object's type?",o:["id()","type()","dir()","help()"],a:1,e:"type(obj) returns the class/type of the given object."},
{q:"Which syntax is commonly used to write a docstring or a multi-line string?",o:["Single quotes","Triple-quoted strings (three single or three double quotes in a row)","Angle brackets","Hash symbols on every line"],a:1,e:"Triple-quoted strings can span multiple lines and are the convention for docstrings."},
{q:"What does the ** operator perform in Python?",o:["Multiplication","Exponentiation","Floor division","Modulo"],a:1,e:"For example, 2 ** 3 evaluates to 8."},
{q:"Which of these correctly checks membership of a value in a list?",o:["x has my_list","x in my_list","my_list.has(x)","x contains my_list"],a:1,e:"The 'in' keyword checks whether a value exists within an iterable."},
{q:"What is bool('') (an empty string) in Python?",o:["True","False","None","Raises an error"],a:1,e:"Empty strings, like empty containers, are considered falsy."},
{q:"What is bool([]) (an empty list) in Python?",o:["True","False","None","1"],a:1,e:"Empty sequences and collections evaluate to False in a boolean context."},
{q:"What is bool(0) in Python?",o:["True","False","None","Error"],a:1,e:"Zero is one of Python's falsy values, alongside None, empty strings, and empty containers."},
{q:"Which of these values is truthy in Python?",o:["0","None","A non-empty string","An empty list"],a:2,e:"Non-empty strings are truthy, unlike zero, None, and empty collections."},
{q:"The chr() function converts:",o:["A character to its integer code point","An integer code point to its corresponding character","A string to lowercase","A float to an int"],a:1,e:"chr(65) returns 'A', the character represented by that Unicode code point."},
{q:"The ord() function converts:",o:["A character to its integer Unicode code point","An integer to a character","A list to a tuple","A string to bytes"],a:0,e:"ord('A') returns 65, the numeric code point of that character."},
{q:"Which of these correctly writes an f-string in Python?",o:["'Value: %s' % x","'Value: {0}'.format(x)","f\"Value: {x}\"","str.concat('Value: ', x)"],a:2,e:"F-strings allow inline expressions inside curly braces prefixed with an f."},
{q:"What does the input() function return?",o:["Whatever type the user types","Always a string","An integer if a number is entered","None"],a:1,e:"input() always returns the entered text as a str; you must convert it explicitly if a number is needed."},
{q:"Which operator performs string concatenation in Python?",o:["&","+","*","."],a:1,e:"The + operator joins two strings together, e.g. 'foo' + 'bar' gives 'foobar'."},
{q:"What is the result of \"ab\" * 3 in Python?",o:["\"ab3\"","\"ababab\"","An error","\"aabbaabbaabb\""],a:1,e:"Multiplying a string by an integer repeats it that many times."},
{q:"Python's scoping rule is commonly summarized by the acronym LEGB, which stands for:",o:["Local, Enclosing, Global, Built-in","Loop, Exception, Global, Break","List, Enum, Generator, Boolean","Local, Exit, Global, Break"],a:0,e:"Name lookups proceed through these four scopes in that order."},
{q:"Which keyword lets a function assign to a variable in the global scope rather than creating a local one?",o:["nonlocal","global","static","extern"],a:1,e:"Declaring 'global x' inside a function tells Python to modify the module-level variable x."},
{q:"Which of these is an immutable sequence type used for storing raw byte data?",o:["bytearray","bytes","list","dict"],a:1,e:"bytes objects are immutable; bytearray is their mutable counterpart."}
 ]},
 data_structures:{name:"Data Structures", qs:[
  {q:"Which built-in Python type is ordered and mutable?",o:["tuple","list","frozenset","str"],a:1,e:"Lists maintain insertion order and can be modified after creation."},
  {q:"Which built-in type is ordered but immutable?",o:["list","dict","tuple","set"],a:2,e:"Tuples preserve order like lists, but can't be changed once created."},
  {q:"A dictionary in Python stores data as:",o:["Ordered pairs of indices","Key-value pairs","A sequence of unique values only","Nested lists only"],a:1,e:"Each value is accessed via its associated key rather than a numeric index."},
  {q:"A set in Python:",o:["Stores duplicate elements in order","Stores unique, unordered elements","Is the same as a tuple","Requires all elements to be dicts"],a:1,e:"Sets automatically discard duplicates and don't guarantee order."},
  {q:"Which method adds a single element to the end of a list?",o:["insert()","append()","extend()","add()"],a:1,e:"append() adds one item to the end; extend() adds multiple items from an iterable."},
  {q:"Given lst = [10,20,30,40], lst[1:3] returns:",o:["[10,20]","[20,30]","[20,30,40]","[30,40]"],a:1,e:"Slicing [1:3] includes index 1 up to (but not including) index 3."},
  {q:"Dictionary keys in Python must be:",o:["Mutable objects like lists","Hashable (e.g. strings, numbers, tuples of immutables)","Always strings","Always integers"],a:1,e:"Keys need a stable hash value, so mutable types like lists can't be used as keys."},
  {q:"Which of these creates a list using a comprehension?",o:["{x for x in range(10)}","[x for x in range(10)]","(x for x in range(10))","list.new(range(10))"],a:1,e:"Square brackets around a for-expression build a list comprehension."}
 ,
{q:"Which list method removes and returns the last element?",o:["remove()","pop()","delete()","clear()"],a:1,e:"Without an index argument, pop() removes and returns the final element."},
{q:"Which list method removes the first matching value (by value, not index)?",o:["pop()","remove()","discard()","index()"],a:1,e:"remove(value) searches for the value and deletes its first occurrence."},
{q:"Which method returns the index of the first occurrence of a value in a list?",o:["find()","index()","search()","locate()"],a:1,e:"index() raises a ValueError if the value isn't found."},
{q:"How does list.sort() differ from the built-in sorted(list) function?",o:["sort() returns a new list; sorted() modifies in place","sort() modifies the list in place and returns None; sorted() returns a new sorted list","They behave identically","sort() only works on strings"],a:1,e:"sort() is a list method affecting the original list, while sorted() works on any iterable and returns a new list."},
{q:"Which list method adds all elements of an iterable to the end of the list?",o:["append()","extend()","insert()","update()"],a:1,e:"extend() adds each element of the given iterable individually, unlike append() which adds it as one item."},
{q:"Why can a tuple be used as a dictionary key while a list cannot?",o:["Tuples are faster to create","Tuples are hashable (immutable); lists are mutable and unhashable","Lists take more memory","Dictionaries only accept numeric keys"],a:1,e:"Dictionary keys must be hashable, and hashability generally requires immutability."},
{q:"Which dictionary method returns a shallow copy of the dictionary?",o:["clone()","copy()","duplicate()","new()"],a:1,e:"dict.copy() creates a new dictionary with the same top-level key-value pairs."},
{q:"Why is dict.get(key, default) often preferred over dict[key]?",o:["It's always faster","It avoids raising a KeyError when the key is missing, returning a default instead","It modifies the dictionary","It only works with string keys"],a:1,e:"get() gracefully handles missing keys instead of raising an exception."},
{q:"Which dictionary method removes and returns a value for a given key (optionally with a default if missing)?",o:["remove()","pop()","delete()","take()"],a:1,e:"dict.pop(key, default) removes the key and returns its value, or the default if absent."},
{q:"Which set operation returns elements present in either of two sets?",o:["intersection()","union() (or the | operator)","difference()","symmetric_difference()"],a:1,e:"Union combines all unique elements from both sets."},
{q:"Which set operation returns elements common to both sets?",o:["union()","intersection() (or the & operator)","difference()","issubset()"],a:1,e:"Intersection keeps only elements present in both sets simultaneously."},
{q:"Which set operation returns elements in one set but not the other?",o:["union()","intersection()","difference() (or the - operator)","issuperset()"],a:2,e:"difference() subtracts the second set's elements from the first."},
{q:"What is a frozenset in Python?",o:["A mutable version of a set","An immutable version of a set","A synonym for a tuple","A special type of dictionary"],a:1,e:"Frozensets can't be modified after creation, which also makes them hashable."},
{q:"Which built-in function converts a list into a set?",o:["list()","set()","tuple()","dict()"],a:1,e:"set(my_list) creates a set containing the list's unique elements."},
{q:"What can nested list comprehensions be used for?",o:["Only creating empty lists","Flattening or transforming multi-dimensional data structures","Deleting elements","Sorting dictionaries only"],a:1,e:"They let you iterate over nested iterables in a single compact expression."},
{q:"Which list method inserts an element at a specific index, shifting subsequent elements?",o:["append()","insert()","extend()","add()"],a:1,e:"insert(index, value) places the value at the given position."},
{q:"What does dict.keys() return in Python 3?",o:["A list copy of the keys","A view object reflecting the dictionary's current keys","A tuple of keys","A set of keys, always unordered"],a:1,e:"View objects dynamically reflect changes made to the dictionary afterward."},
{q:"What does dict.items() return?",o:["Only the values","A view object of key-value pairs as tuples","A nested dictionary","A generator that can only be used once"],a:1,e:"Each item is a (key, value) tuple, accessible through the returned view."},
{q:"Since Python 3.7, which collection type officially guarantees insertion order by default?",o:["set","dict","frozenset","tuple (order was never guaranteed before)"],a:1,e:"Standard dicts maintain the order in which keys were first inserted."},
{q:"What does collections.Counter primarily do?",o:["Sorts a list","Counts the occurrences of hashable objects in an iterable","Removes duplicates","Converts a list to a set"],a:1,e:"It returns a dict-like object mapping each element to its count."},
{q:"What does collections.defaultdict provide?",o:["A dictionary that raises errors on missing keys","A dictionary that supplies a default value automatically for missing keys via a factory function","A read-only dictionary","A dictionary sorted by value"],a:1,e:"Accessing a missing key triggers the factory function to create a default value instead of raising KeyError."},
{q:"What makes collections.deque efficient compared to a regular list for queue-like operations?",o:["Fast random access in the middle","Fast O(1) appends and pops from both ends","It automatically sorts elements","It uses less memory always"],a:1,e:"Deques are implemented to support constant-time operations at both the front and back."},
{q:"Which expression checks if a key exists in a dictionary?",o:["my_dict.has_key(key) in modern Python","key in my_dict","my_dict.contains(key)","key.exists(my_dict)"],a:1,e:"'in' checks dictionary keys directly and efficiently; has_key() was removed in Python 3."},
{q:"What happens when you access a missing key in a regular dict using square brackets?",o:["Returns None","Raises a KeyError","Returns an empty string","Creates the key automatically"],a:1,e:"Unlike get() or defaultdict, direct bracket access raises an exception for missing keys."},
{q:"What does the slice lst[::2] return?",o:["Every element reversed","Every second element of the list, from start to end","Only the first two elements","An error"],a:1,e:"The step value of 2 skips every other element while traversing the full list."}
 ]},
 functions:{name:"Functions", qs:[
  {q:"A lambda function in Python is:",o:["A named multi-line function","An anonymous, single-expression function","A class method only","A type of loop"],a:1,e:"Lambdas are compact, unnamed functions limited to a single expression."},
  {q:"*args in a function definition allows:",o:["A fixed number of keyword arguments only","A variable number of positional arguments","No arguments at all","Only one argument"],a:1,e:"Extra positional arguments are collected into a tuple named args."},
  {q:"**kwargs in a function definition allows:",o:["A variable number of keyword arguments, collected into a dict","Only positional arguments","Exactly two arguments","A single default argument"],a:0,e:"Extra keyword arguments are gathered into a dictionary named kwargs."},
  {q:"A function without an explicit return statement returns:",o:["0","An empty string","None","An error"],a:2,e:"Python functions implicitly return None if no return statement is executed."},
  {q:"Default argument values are specified:",o:["With a colon in the function body","Using = in the function signature","In a separate defaults() call","Only for the first parameter"],a:1,e:"e.g. def greet(name='World'): sets 'World' as the default for name."},
  {q:"Recursion requires which of the following to terminate correctly?",o:["A loop","A base case","A global variable","Multiple return statements"],a:1,e:"Without a base case, a recursive function would call itself indefinitely."},
  {q:"A function that calls itself is called:",o:["Iterative","Recursive","Static","Abstract"],a:1,e:"That's the defining trait of recursion."},
  {q:"The map() function:",o:["Filters items based on a condition","Applies a given function to every item of an iterable","Sorts an iterable","Reverses an iterable"],a:1,e:"It returns an iterator of results after applying the function to each element."}
 ,
{q:"A closure in Python is:",o:["A function with no arguments","A function that captures and remembers variables from its enclosing scope","A syntax error","A built-in decorator"],a:1,e:"Closures let inner functions retain access to variables from the scope they were defined in."},
{q:"Which keyword allows a nested function to modify a variable in its immediately enclosing (non-global) function's scope?",o:["global","nonlocal","local","outer"],a:1,e:"'nonlocal' targets the nearest enclosing scope, distinct from the module-level 'global'."},
{q:"When calling func(*my_list), the * operator:",o:["Multiplies the list elements","Unpacks the list into separate positional arguments","Converts the list to a dict","Raises an error"],a:1,e:"Each element of my_list is passed as its own positional argument to func."},
{q:"When calling func(**my_dict), the ** operator:",o:["Squares the dictionary's values","Unpacks the dict into keyword arguments matching parameter names","Merges two dictionaries","Is invalid syntax"],a:1,e:"Each key becomes a keyword argument name, with its corresponding value passed in."},
{q:"A function's docstring is:",o:["A comment starting with #","A string literal placed right after the def line to document the function","A required type hint","A special decorator"],a:1,e:"It's accessible via the function's __doc__ attribute and commonly shown by help()."},
{q:"What's a common pitfall with mutable default arguments, like def f(x=[])?",o:["They cause a syntax error","The default list is created once and shared across all calls, causing unexpected accumulated state","They're automatically copied each call","They can't be used at all"],a:1,e:"Because default values are evaluated once at function definition, mutating them persists across calls."},
{q:"What is a higher-order function?",o:["A function with many parameters","A function that takes another function as an argument or returns a function","A recursive function","A function decorated with @property"],a:1,e:"Examples include map(), filter(), and custom functions that accept callbacks."},
{q:"What does the filter() function do?",o:["Applies a transformation to every element","Returns an iterator of elements for which a given function returns True","Sorts elements","Removes duplicates automatically"],a:1,e:"Only elements passing the predicate function are kept in the resulting iterator."},
{q:"What does functools.reduce() do?",o:["Filters elements based on a condition","Cumulatively applies a function to reduce an iterable down to a single value","Sorts an iterable in place","Splits a list into chunks"],a:1,e:"For example, reduce with addition sums all elements of a list into one total."},
{q:"How do you force certain function arguments to be passed only by keyword?",o:["Prefix them with an underscore","Place a bare * before them in the parameter list","Use **kwargs only","It's not possible in Python"],a:1,e:"Parameters listed after a bare * must be supplied using keyword=value syntax."},
{q:"How are positional-only parameters indicated in a Python function signature?",o:["With a trailing comma","With a / in the parameter list","With double underscores","They don't exist in Python"],a:1,e:"Parameters before the / can only be passed positionally, not by keyword."},
{q:"What is the purpose of function annotations like def f(x: int) -> int?",o:["They are strictly enforced type checks at runtime","They provide optional type hints for readability and static analysis tools, not enforced at runtime","They convert arguments automatically","They replace docstrings"],a:1,e:"Python itself doesn't enforce these hints; tools like mypy use them for static checking."},
{q:"Can a Python function return multiple values?",o:["No, only one value is ever possible","Yes, effectively as a tuple that can be unpacked by the caller","Only using global variables","Only with generators"],a:1,e:"Writing 'return a, b' packs the values into a tuple automatically."},
{q:"What does the functools.wraps decorator help preserve when writing your own decorators?",o:["The original function's execution speed","The original function's __name__ and __doc__ metadata","The original function's arguments only","Nothing useful"],a:1,e:"Without it, a wrapped function would lose its original name and docstring, complicating debugging."},
{q:"What happens if a recursive function never reaches its base case?",o:["It runs forever with no consequences","It eventually raises a RecursionError due to exceeding the maximum call stack depth","Python automatically optimizes it","It returns None immediately"],a:1,e:"Python doesn't perform tail-call optimization, so unbounded recursion exhausts the call stack."},
{q:"Roughly what is CPython's default maximum recursion depth?",o:["Around 1000 (configurable via sys.setrecursionlimit)","Exactly 100","Unlimited by default","10"],a:0,e:"This default can be changed, though raising it risks a genuine stack overflow in the interpreter."},
{q:"Does standard Python support tail call optimization?",o:["Yes, always","No, it's not natively supported","Only for recursive generators","Only in Python 2"],a:1,e:"Unlike some functional languages, CPython does not optimize away tail-recursive calls."},
{q:"Which construct provides a simple built-in way to memoize (cache) function results without external libraries?",o:["The @staticmethod decorator","functools.lru_cache decorator","The global keyword","List comprehensions"],a:1,e:"lru_cache stores previous call results, returning them instantly for repeated arguments."},
{q:"A pure function is one that:",o:["Modifies global state","Has no side effects and returns the same output for the same input","Always uses recursion","Can only take one argument"],a:1,e:"Purity makes functions easier to test, reason about, and cache."},
{q:"What does 'first-class functions' mean in the context of Python?",o:["Functions execute faster than other code","Functions can be passed as arguments, returned from other functions, and assigned to variables, like any other object","Only built-in functions qualify","Functions must be defined at the top of a file"],a:1,e:"This flexibility underlies higher-order functions, decorators, and callbacks in Python."},
{q:"Which module provides the lru_cache decorator for memoization?",o:["itertools","functools","collections","operator"],a:1,e:"functools houses several tools for working with functions, including caching decorators."},
{q:"What is the main purpose of @functools.lru_cache?",o:["To sort function outputs","To cache function results, speeding up repeated calls with the same arguments","To enforce type checking","To log function calls"],a:1,e:"Cached results avoid recomputation for previously seen argument combinations."},
{q:"Can you define a function inside another function in Python?",o:["No, functions cannot be nested","Yes, these are called nested or inner functions and can form closures","Only inside classes","Only using lambda"],a:1,e:"Nested functions are a common building block for closures and decorators."},
{q:"What does the walrus operator (:=) allow you to do?",o:["Compare two values for equality","Perform assignment as part of a larger expression","Define a lambda function","Create a generator"],a:1,e:"It lets you assign a value to a variable within, for example, a while-loop condition or comprehension."},
{q:"Which keyword immediately exits a function, optionally passing back a value?",o:["break","continue","return","yield"],a:2,e:"'return' ends function execution and sends the given value back to the caller."}
 ]},
 oop_python:{name:"OOP in Python", qs:[
  {q:"The __init__ method in a Python class:",o:["Deletes an object","Acts as the constructor, run when an object is created","Is called only for static methods","Runs after the program ends"],a:1,e:"It initializes the new object's attributes right after creation."},
  {q:"The 'self' parameter in an instance method refers to:",o:["The class itself","The instance the method is called on","A global variable","The parent class"],a:1,e:"It lets the method access and modify the specific object's attributes."},
  {q:"Does Python support multiple inheritance?",o:["No, never","Yes, a class can inherit from multiple base classes","Only in Python 2","Only for built-in types"],a:1,e:"Python allows a class to list multiple parent classes, e.g. class C(A, B):."},
  {q:"A @staticmethod decorated method:",o:["Automatically receives self as the first argument","Doesn't take self and can't access instance state directly","Can only be called on the class, never an instance","Must return None"],a:1,e:"It behaves like a plain function placed inside the class namespace."},
  {q:"A @classmethod's first parameter is conventionally:",o:["self","cls, representing the class itself","args","None"],a:1,e:"cls gives access to the class itself, useful for alternate constructors."},
  {q:"The __str__ method is used to:",o:["Delete a string attribute","Define the human-readable string representation of an object","Convert an object to an integer","Compare two objects"],a:1,e:"It's called by str(obj) and print(obj) to produce readable output."},
  {q:"Method Resolution Order (MRO) determines:",o:["The order variables are declared","The order classes are searched for inherited methods/attributes","The order a program executes top to bottom","Nothing relevant to inheritance"],a:1,e:"It matters especially with multiple inheritance, following an algorithm like C3 linearization."},
  {q:"The __repr__ method is meant to provide:",o:["A user-friendly display string only","An unambiguous representation, often useful for debugging","A way to delete objects","A comparison operator"],a:1,e:"Ideally, eval(repr(obj)) could recreate an equivalent object."}
 ,
{q:"What does the __del__ method do in a Python class?",o:["Deletes the class definition","Acts as a destructor, called when an object is about to be garbage collected","Removes an attribute","Deletes a dictionary key"],a:1,e:"It's rarely relied upon directly due to the unpredictability of garbage collection timing."},
{q:"Python's multiple inheritance method resolution is based on:",o:["Alphabetical order of class names","The C3 linearization algorithm, producing the Method Resolution Order (MRO)","Random selection","The order methods were called at runtime"],a:1,e:"C3 linearization produces a consistent, predictable order for searching inherited methods."},
{q:"Which special (dunder) method allows an object to work with the built-in len() function?",o:["__length__","__len__","__size__","__count__"],a:1,e:"Implementing __len__ lets len(obj) return a custom value."},
{q:"Which special method allows an object to support indexing syntax like obj[i]?",o:["__index__","__getitem__","__item__","__slice__"],a:1,e:"__getitem__ defines the behavior for square-bracket access on custom objects."},
{q:"Which special method defines equality comparison (==) behavior for custom objects?",o:["__cmp__","__eq__","__equal__","__is__"],a:1,e:"Without __eq__, == falls back to comparing object identity by default."},
{q:"Which special method allows an object instance to be called like a function, e.g. obj()?",o:["__call__","__invoke__","__run__","__func__"],a:0,e:"Implementing __call__ makes instances of the class callable."},
{q:"What is a metaclass in Python?",o:["A class with only static methods","A class whose instances are themselves classes, controlling how classes are created","A synonym for a base class","A built-in decorator"],a:1,e:"The default metaclass for most classes is 'type', but custom metaclasses can control class creation."},
{q:"Which built-in function typically returns the metaclass of a class?",o:["class()","type()","meta()","instance()"],a:1,e:"type(SomeClass) generally returns the metaclass responsible for creating SomeClass."},
{q:"What does isinstance(obj, SomeClass) check?",o:["Whether obj is exactly of type SomeClass, ignoring subclasses","Whether obj is an instance of SomeClass or any of its subclasses","Whether obj has any attributes","Whether SomeClass exists"],a:1,e:"isinstance() correctly accounts for inheritance, unlike a strict type() comparison."},
{q:"What does issubclass(A, B) check?",o:["Whether A is an instance of B","Whether class A is a subclass of class B","Whether A and B share the same methods","Whether A has been instantiated"],a:1,e:"It verifies the class hierarchy relationship between two classes."},
{q:"In Python, all classes are ultimately subclasses of:",o:["type","object","Base","Class"],a:1,e:"Every class, whether explicitly stated or not, inherits from the built-in object class."},
{q:"What does the __slots__ attribute do in a class?",o:["Allows unlimited dynamic attributes","Restricts instances to a fixed, predefined set of attributes, saving memory","Deletes all attributes","Makes a class abstract"],a:1,e:"By avoiding a per-instance __dict__, __slots__ reduces memory overhead for many instances."},

/* ---------------- App state & helpers ---------------- */
const state = {screen:'home', subjectKey:null, topicKey:null, numQ:8, secPerQ:15, quiz:[], idx:0, score:0, timer:null, timeLeft:0, answers:[], startedAt:0};

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

const ALL_TOPICS = '__ALL__';

function getTopicPool(subjectKey, topicKey){
  const subj = BANK[subjectKey];
  if(topicKey === ALL_TOPICS){
    return Object.values(subj.topics).flatMap(t=>t.qs);
  }
  return subj.topics[topicKey].qs;
}

function getTopicName(subjectKey, topicKey){
  if(topicKey === ALL_TOPICS) return 'Full Subject — All Topics';
  return BANK[subjectKey].topics[topicKey].name;
}

function computeNumOptions(maxQ){
  let base;
  if(maxQ<=20) base=[5,10,15];
  else if(maxQ<=40) base=[5,10,20,30];
  else if(maxQ<=120) base=[10,20,40,60];
  else base=[10,25,50,100,150];
  const opts = base.filter(v=>v<maxQ);
  opts.push(maxQ);
  return [...new Set(opts)].sort((a,b)=>a-b);
}

function buildQuiz(subjectKey, topicKey, n){
  const pool = getTopicPool(subjectKey, topicKey);
  const chosen = shuffle(pool).slice(0, Math.min(n, pool.length));
  return chosen.map(item=>{
    const optIdx = shuffle(item.o.map((o,i)=>i));
    const options = optIdx.map(i=>item.o[i]);
    const answer = optIdx.indexOf(item.a);
    return {q:item.q, options, answer, exp:item.e};
  });
}

function bestKey(subjectKey, topicKey){ return 'sq_best_'+subjectKey+'_'+topicKey; }
function getBest(subjectKey, topicKey){
  try{ const v = localStorage.getItem(bestKey(subjectKey,topicKey)); return v? JSON.parse(v): null; }catch(e){ return null; }
}
function setBest(subjectKey, topicKey, score, total){
  try{
    const cur = getBest(subjectKey, topicKey);
    const pct = score/total;
    if(!cur || pct > (cur.score/cur.total)){
      localStorage.setItem(bestKey(subjectKey,topicKey), JSON.stringify({score,total}));
      return true;
    }
  }catch(e){}
  return false;
}

/* ---------------- Rendering ---------------- */
const screens = ['home','topics','config','quiz','results'];
function show(screen){
  state.screen = screen;
  screens.forEach(s=>{
    document.getElementById('screen-'+s).classList.toggle('hidden', s!==screen);
  });
  renderCrumbs();
  window.scrollTo({top:0, behavior:'instant'});
}

function renderCrumbs(){
  const el = document.getElementById('crumbs');
  let parts = [];
  parts.push('<button onclick="goHome()">subjects</button>');
  if(state.subjectKey && (state.screen==='topics'||state.screen==='config'||state.screen==='quiz'||state.screen==='results')){
    parts.push('<span class="sep">/</span>');
    if(state.screen==='topics') parts.push('<span class="now">'+BANK[state.subjectKey].name+'</span>');
    else parts.push('<button onclick="goTopics()">'+BANK[state.subjectKey].name+'</button>');
  }
  if(state.topicKey && (state.screen==='config'||state.screen==='quiz'||state.screen==='results')){
    parts.push('<span class="sep">/</span>');
    parts.push('<span class="now">'+getTopicName(state.subjectKey, state.topicKey)+'</span>');
  }
  el.innerHTML = parts.join('');
}

function renderHome(){
  const grid = document.getElementById('subjectGrid');
  grid.innerHTML = '';
  Object.keys(BANK).forEach(key=>{
    const subj = BANK[key];
    const topicCount = Object.keys(subj.topics).length;
    const qCount = Object.values(subj.topics).reduce((s,t)=>s+t.qs.length,0);
    const card = document.createElement('button');
    card.className = 'card';
    card.style.setProperty('--card-accent', subj.accent);
    card.innerHTML = `<div class="bar"></div><div class="snippet mono">${subj.snippet}</div><div class="name">${subj.name}</div><div class="meta mono">${topicCount} topics · ${qCount} questions</div>`;
    card.onclick = ()=>{ state.subjectKey = key; renderTopics(); show('topics'); };
    grid.appendChild(card);
  });
}

function goHome(){ show('home'); }
function goTopics(){ renderTopics(); show('topics'); }
