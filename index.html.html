<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IT Interview Quiz — DSA · OOP · SQL · DBMS · Python</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  --bg:#0e0f13;
  --surface:#16181f;
  --surface2:#1d2029;
  --border:#2a2d38;
  --text:#e9eaf0;
  --muted:#8b8fa3;
  --muted2:#5c6072;
  --good:#6fd88a;
  --bad:#ff7a7a;
  --accent:#5eb8ff;
  --accent-dim:rgba(94,184,255,0.14);
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f4f5f7;
    --surface:#ffffff;
    --surface2:#eef0f4;
    --border:#dcdfe6;
    --text:#181a20;
    --muted:#5c6072;
    --muted2:#8b8fa3;
  }
}
:root[data-theme="dark"]{
  --bg:#0e0f13; --surface:#16181f; --surface2:#1d2029; --border:#2a2d38; --text:#e9eaf0; --muted:#8b8fa3; --muted2:#5c6072;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{
  max-width:760px;
  margin:0 auto;
  padding:28px 20px 60px;
}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;}
.topbar{
  display:flex; align-items:baseline; justify-content:space-between;
  margin-bottom:26px; gap:12px; flex-wrap:wrap;
}
.brand{font-family:'JetBrains Mono',monospace; font-size:14px; color:var(--muted); letter-spacing:0.01em;}
.brand b{color:var(--text); font-weight:600;}
.brand .cursor{display:inline-block;width:7px;height:14px;background:var(--accent);margin-left:2px;vertical-align:-2px;animation:blink 1.1s steps(1) infinite;}
@keyframes blink{50%{opacity:0;}}
.crumbs{font-family:'JetBrains Mono',monospace; font-size:12.5px; color:var(--muted2);}
.crumbs button{background:none;border:none;color:var(--muted); font-family:inherit; font-size:inherit; cursor:pointer; padding:0;}
.crumbs button:hover{color:var(--accent);}
.crumbs .sep{margin:0 5px; color:var(--muted2);}
.crumbs .now{color:var(--text);}

.back-btn{
  background:none; border:none; color:var(--muted); font-family:'JetBrains Mono',monospace;
  font-size:13px; cursor:pointer; padding:0; margin-bottom:14px; display:inline-block;
}
.back-btn:hover{color:var(--accent);}

.end-btn{
  background:none; border:1px solid var(--border); color:var(--muted); font-family:'JetBrains Mono',monospace;
  font-size:11.5px; cursor:pointer; padding:5px 10px; border-radius:5px;
}
.end-btn:hover{border-color:var(--bad); color:var(--bad);}
.end-btn.confirm{border-color:var(--bad); color:var(--bad); background:rgba(255,122,122,0.12);}

h1{
  font-size:26px; font-weight:800; line-height:1.25; margin:0 0 6px;
  letter-spacing:-0.01em;
}
.sub{color:var(--muted); font-size:14.5px; line-height:1.55; margin:0 0 26px; max-width:56ch;}

/* subject grid */
.grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
@media (max-width:520px){ .grid{grid-template-columns:1fr;} }
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:8px;
  padding:18px 18px 16px; text-align:left; cursor:pointer; color:var(--text);
  font-family:inherit; display:flex; flex-direction:column; gap:10px; min-height:118px;
  transition:border-color .15s ease, transform .1s ease;
  position:relative; overflow:hidden;
}
.card:hover{border-color:var(--card-accent, var(--accent));}
.card:active{transform:scale(0.99);}
.card:focus-visible{outline:2px solid var(--card-accent,var(--accent)); outline-offset:2px;}
.card .snippet{
  font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--card-accent,var(--accent));
  opacity:0.85;
}
.card .name{font-size:16.5px; font-weight:700;}
.card .meta{font-size:12.5px; color:var(--muted2); margin-top:auto;}
.card .bar{position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--card-accent,var(--accent));}

/* topic list */
.topics{display:flex; flex-direction:column; border:1px solid var(--border); border-radius:8px; overflow:hidden;}
.topic-row{
  display:flex; align-items:center; justify-content:space-between; gap:14px;
  padding:15px 16px; background:var(--surface); border-bottom:1px solid var(--border);
  cursor:pointer; color:var(--text); font-family:inherit; text-align:left; width:100%;
}
.topic-row:last-child{border-bottom:none;}
.topic-row:hover{background:var(--surface2);}
.topic-row-all{background:var(--accent-dim); border-bottom:1px solid var(--card-accent,var(--border)); border-bottom-width:1.5px;}
.topic-row-all:hover{background:var(--accent-dim);}
.topic-left{display:flex; align-items:center; gap:12px; min-width:0;}
.topic-dot{width:8px;height:8px;border-radius:2px;background:var(--card-accent,var(--accent)); flex:none;}
.topic-name{font-weight:600; font-size:14.5px;}
.topic-count{font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--muted2);}
.topic-best{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--muted);}
.topic-best b{color:var(--good);}
.chev{color:var(--muted2); font-size:14px;}

/* config */
.panel{background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:22px;}
.field{margin-bottom:20px;}
.field:last-child{margin-bottom:0;}
.field-label{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--muted); margin-bottom:10px; display:block;}
.opt-row{display:flex; gap:8px; flex-wrap:wrap;}
.opt-btn{
  padding:9px 16px; border-radius:6px; border:1px solid var(--border); background:var(--surface2);
  color:var(--text); font-family:'JetBrains Mono',monospace; font-size:13px; cursor:pointer;
}
.opt-btn.active{border-color:var(--card-accent,var(--accent)); background:var(--accent-dim); color:var(--card-accent,var(--accent));}
.start-btn{
  margin-top:24px; width:100%; padding:14px; border-radius:7px; border:none;
  background:var(--card-accent,var(--accent)); color:#0b0c10; font-weight:700; font-size:15px;
  cursor:pointer; font-family:'Inter',sans-serif;
}
.start-btn:active{transform:scale(0.995);}

/* quiz */
.quiz-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:10px;}
.q-progress{font-family:'JetBrains Mono',monospace; font-size:12.5px; color:var(--muted);}
.q-score{font-family:'JetBrains Mono',monospace; font-size:12.5px; color:var(--muted);}
.timerbar{height:4px; width:100%; background:var(--surface2); border-radius:2px; overflow:hidden; margin-bottom:22px;}
.timerfill{height:100%; background:var(--card-accent,var(--accent)); width:100%; transition:width 1s linear;}
.timerfill.warn{background:var(--bad);}
.qtext{font-size:19px; font-weight:700; line-height:1.5; margin:0 0 20px;}
.options{display:flex; flex-direction:column; gap:10px;}
.option{
  text-align:left; padding:14px 16px; border-radius:7px; border:1px solid var(--border);
  background:var(--surface); color:var(--text); font-family:inherit; font-size:14.5px; cursor:pointer;
  display:flex; align-items:center; gap:12px;
}
.option:hover:not(.locked){border-color:var(--card-accent,var(--accent));}
.option .tag{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--muted2); border:1px solid var(--border); border-radius:4px; width:20px; height:20px; display:flex; align-items:center; justify-content:center; flex:none;}
.option.correct{border-color:var(--good); background:rgba(111,216,138,0.1);}
.option.correct .tag{color:var(--good); border-color:var(--good);}
.option.wrong{border-color:var(--bad); background:rgba(255,122,122,0.1);}
.option.wrong .tag{color:var(--bad); border-color:var(--bad);}
.option.locked{cursor:default;}
.exp{font-size:13px; color:var(--muted); margin-top:16px; line-height:1.6; padding:12px 14px; background:var(--surface2); border-radius:6px; border:1px solid var(--border);}
.next-row{margin-top:20px; display:flex; justify-content:flex-end;}
.next-btn{padding:10px 20px; border-radius:6px; border:1px solid var(--border); background:var(--surface2); color:var(--text); font-family:'JetBrains Mono',monospace; font-size:13px; cursor:pointer;}
.next-btn:hover{border-color:var(--card-accent,var(--accent));}

/* results */
.result-hero{text-align:center; padding:30px 10px 26px; border:1px solid var(--border); border-radius:8px; background:var(--surface); margin-bottom:18px;}
.result-score{font-family:'JetBrains Mono',monospace; font-size:44px; font-weight:700; color:var(--card-accent,var(--accent));}
.result-total{font-family:'JetBrains Mono',monospace; font-size:16px; color:var(--muted);}
.result-tag{margin-top:10px; font-size:13.5px; color:var(--muted);}
.best-badge{display:inline-block; margin-top:10px; font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--good); border:1px solid var(--good); padding:3px 9px; border-radius:20px;}
.review{border:1px solid var(--border); border-radius:8px; overflow:hidden; margin-bottom:20px;}
.rev-item{padding:14px 16px; border-bottom:1px solid var(--border); background:var(--surface);}
.rev-item:last-child{border-bottom:none;}
.rev-q{font-size:13.5px; font-weight:600; margin-bottom:8px;}
.rev-line{font-size:12.5px; color:var(--muted); font-family:'JetBrains Mono',monospace; margin-bottom:2px;}
.rev-line.ok{color:var(--good);}
.rev-line.bad{color:var(--bad);}
.result-actions{display:flex; gap:10px; flex-wrap:wrap;}
.result-actions button{flex:1; min-width:140px; padding:13px; border-radius:7px; font-family:'Inter',sans-serif; font-size:14px; cursor:pointer;}
.btn-primary{border:none; background:var(--card-accent,var(--accent)); color:#0b0c10; font-weight:700;}
.btn-ghost{border:1px solid var(--border); background:var(--surface2); color:var(--text); font-weight:600;}

.hidden{display:none !important;}
footer{margin-top:40px; text-align:center; font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--muted2);}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand mono">IT <b>Interview Quiz</b><span class="cursor"></span></div>
    <div class="crumbs mono" id="crumbs"></div>
  </div>

  <div id="screen-home">
    <h1>Pick a subject.</h1>
    <p class="sub">DSA, OOP, SQL, DBMS and Python — each broken into topics. Every attempt pulls a fresh, shuffled set of questions, so retaking a topic never looks the same twice.</p>
    <div class="grid" id="subjectGrid"></div>
  </div>

  <div id="screen-topics" class="hidden">
    <button class="back-btn mono" onclick="goHome()">‹ subjects</button>
    <h1 id="topicsTitle">Subject</h1>
    <p class="sub" id="topicsSub"></p>
    <div class="topics" id="topicList"></div>
  </div>

  <div id="screen-config" class="hidden">
    <button class="back-btn mono" onclick="goTopics()">‹ topics</button>
    <h1 id="configTitle">Topic</h1>
    <p class="sub" id="configSub"></p>
    <div class="panel">
      <div class="field">
        <label class="field-label"># QUESTIONS</label>
        <div class="opt-row" id="numRow"></div>
      </div>
      <div class="field">
        <label class="field-label">SECONDS PER QUESTION</label>
        <div class="opt-row" id="timeRow"></div>
      </div>
      <button class="start-btn" id="startBtn">Start timed challenge →</button>
    </div>
  </div>

  <div id="screen-quiz" class="hidden">
    <div class="quiz-head">
      <div class="q-progress mono" id="qProgress"></div>
      <div style="display:flex; align-items:center; gap:14px;">
        <div class="q-score mono" id="qScore"></div>
        <button class="end-btn mono" id="endQuizBtn" onclick="endQuizEarly()">end quiz ✕</button>
      </div>
    </div>
    <div class="timerbar"><div class="timerfill" id="timerFill"></div></div>
    <div class="qtext" id="qText"></div>
    <div class="options" id="qOptions"></div>
    <div class="exp hidden" id="qExp"></div>
    <div class="next-row hidden" id="nextRow"><button class="next-btn mono" id="nextBtn">next →</button></div>
  </div>

  <div id="screen-results" class="hidden">

    <div class="result-hero">
      <div class="result-score mono" id="resScore"></div>
      <div class="result-total mono" id="resTotal"></div>
      <div class="result-tag" id="resTag"></div>
      <div id="resBest"></div>
    </div>
    <div class="review" id="review"></div>
    <div class="result-actions">
      <button class="btn-primary" id="retryBtn">Retry — new questions</button>
      <button class="btn-ghost" id="backBtn">Back to topics</button>
    </div>
  </div>

  <footer>fresh questions every attempt · scores saved on this device only</footer>
</div>

<script>
/* ---------------- Question bank ---------------- */
const BANK = {
dsa:{name:"Data Structures & Algorithms", accent:"#5eb8ff", snippet:"while(l<r){...}", topics:{
 arrays:{name:"Arrays & Strings", qs:[
  {q:"What is the time complexity to access an element by index in an array?",o:["O(1)","O(n)","O(log n)","O(n^2)"],a:0,e:"Arrays support direct/random access via index arithmetic, so it's constant time."},
  {q:"Inserting an element at the beginning of a dynamic array (like a Python list) is:",o:["O(1)","O(n)","O(log n)","O(n log n)"],a:1,e:"All existing elements must shift right by one position, which takes O(n)."},
  {q:"The two-pointer technique is most commonly used to:",o:["Sort a linked list","Find pairs with a target sum in a sorted array","Traverse a graph","Balance a binary tree"],a:1,e:"Two pointers moving from opposite ends efficiently narrow down pair sums in sorted data."},
  {q:"Reversing a string of length n in place takes:",o:["O(1)","O(log n)","O(n)","O(n^2)"],a:2,e:"Each of the n characters is swapped once, giving linear time."},
  {q:"Kadane's algorithm is used to find:",o:["The shortest path in a graph","The maximum subarray sum","The kth smallest element","A topological order"],a:1,e:"Kadane's algorithm computes the maximum sum of a contiguous subarray in O(n)."},
  {q:"The sliding window technique is best suited for:",o:["Sorting arrays","Problems on contiguous subarrays or substrings","Building a heap","Detecting graph cycles"],a:1,e:"A sliding window maintains a moving range over contiguous elements, avoiding recomputation."},
  {q:"Checking if a string is a palindrome using two pointers takes:",o:["O(1)","O(n)","O(n^2)","O(log n)"],a:1,e:"Each character is compared once as pointers move inward, so it's linear."},
  {q:"Which statement about arrays vs. linked lists is TRUE?",o:["Linked lists support O(1) random access","Arrays support O(1) random access, linked lists don't","Both support O(1) random access","Neither supports random access"],a:1,e:"Arrays use contiguous memory for direct indexing; linked lists must be traversed node by node."}
 ,
{q:"Which is generally faster for frequent insertions at arbitrary positions: array or linked list?",o:["Array","Linked list","Both are equal","Neither supports insertion"],a:1,e:"Linked lists avoid the shifting cost that arrays incur when inserting in the middle."},
{q:"What is the space complexity of an array holding n integers?",o:["O(1)","O(log n)","O(n)","O(n^2)"],a:2,e:"Space grows linearly with the number of elements stored."},
{q:"Which technique finds the intersection of two sorted arrays in O(n+m) time?",o:["Binary search","Two pointers","Recursion","Hashing only"],a:1,e:"Two pointers advance through both sorted arrays simultaneously, comparing elements."},
{q:"Prefix sum arrays let you answer range sum queries in:",o:["O(n) per query","O(1) per query after O(n) preprocessing","O(log n) per query always","O(n^2) preprocessing"],a:1,e:"Once prefix sums are precomputed, any range sum is a simple subtraction."},
{q:"The Dutch National Flag algorithm (3-way partitioning) runs in:",o:["O(n log n)","O(n)","O(n^2)","O(log n)"],a:1,e:"It partitions the array into three sections in a single linear pass."},
{q:"A sliding window maximum over an array is efficiently solved in O(n) using:",o:["A max-heap only","A monotonic deque","Binary search","Recursion"],a:1,e:"A deque maintains candidates for the maximum in decreasing order as the window slides."},
{q:"In-place array rotation by k positions can be achieved in O(n) time and O(1) extra space using:",o:["Merge sort","The reversal algorithm","A hash map","Binary search"],a:1,e:"Reversing sub-segments and then the whole array rotates it without extra space."},
{q:"Two strings are anagrams of each other if:",o:["They have the same length only","They contain the same characters with the same frequency","They start with the same letter","They are palindromes"],a:1,e:"Anagrams are rearrangements of the same multiset of characters."},
{q:"Merging two already-sorted arrays of size n and m takes:",o:["O(n*m)","O(n+m)","O(log(n+m))","O((n+m) log(n+m))"],a:1,e:"A single pass with two pointers merges them linearly."},
{q:"A circular array is best described as one that:",o:["Cannot be resized","Wraps around, treating the end as adjacent to the start","Only stores circular shapes","Has no fixed size limit"],a:1,e:"Index arithmetic wraps using modulo so the 'end' connects back to the 'start'."},
{q:"To find a majority element (appearing more than n/2 times) in O(n) time and O(1) space, you'd use:",o:["Merge sort","The Boyer-Moore Voting algorithm","A hash map","Binary search"],a:1,e:"The voting algorithm cancels out non-majority elements, leaving the majority as the survivor."},
{q:"An 'in-place' algorithm on an array generally means it:",o:["Uses O(n) extra space","Uses O(1) (or very small) extra space and modifies the input directly","Cannot modify the array","Always requires sorting first"],a:1,e:"In-place algorithms avoid allocating significant additional memory."},
{q:"Computing the Longest Common Subsequence of two strings of length m and n takes:",o:["O(m+n)","O(m*n) with dynamic programming","O(log(m*n))","O(1)"],a:1,e:"A 2D DP table of size m by n is filled to compute the LCS."},
{q:"The Two Sum problem (find a pair summing to a target) can be solved in O(n) time using:",o:["A hash map","Bubble sort","A stack","Recursion only"],a:0,e:"Storing seen values in a hash map lets you check for the complement in O(1) per element."},
{q:"Which array operation has O(n) worst-case time?",o:["Accessing an element by index","Deleting an element from the middle","Getting the array length","Appending when capacity is available"],a:1,e:"Deleting from the middle requires shifting subsequent elements left."},
{q:"Given a sorted array, the most efficient way to check if an element exists is:",o:["Linear scan","Binary search","Bubble sort first","Hashing the whole array first"],a:1,e:"Binary search exploits the sorted order to eliminate half the candidates each step."},
{q:"Building a prefix sum array of length n takes:",o:["O(1)","O(log n)","O(n)","O(n^2)"],a:2,e:"Each prefix sum is computed once in a single linear pass."},
{q:"The KMP (Knuth-Morris-Pratt) string matching algorithm improves on the naive approach by achieving:",o:["O(n*m)","O(n+m)","O(n^2)","O(log n)"],a:1,e:"KMP precomputes a failure function to avoid re-scanning matched characters."},
{q:"Finding the next greater element for every element in an array in O(n) time uses:",o:["A monotonic stack","A sorted array","A min-heap","Nested loops"],a:0,e:"A stack of indices maintained in decreasing value order efficiently resolves this for every element."},
{q:"A fixed-size array-based stack implementation has a maximum capacity unless:",o:["It's declared as a linked list","It's resized/reallocated dynamically","It uses recursion","It's converted to a queue"],a:1,e:"Without dynamic resizing, an array-based structure is limited to its initial allocation."},
{q:"Checking whether an array contains duplicate elements using a hash set takes:",o:["O(1)","O(log n)","O(n) on average","O(n^2)"],a:2,e:"Each element is inserted/checked in the hash set in roughly O(1) average time, over n elements."},
{q:"Two-dimensional arrays are typically stored in memory as:",o:["Linked nodes scattered across memory","Contiguous blocks, in row-major or column-major order","A hash table","A tree structure"],a:1,e:"Most languages flatten 2D arrays into a single contiguous memory block for efficiency."},
{q:"Rotating an n x n matrix by 90 degrees in place takes:",o:["O(n)","O(n log n)","O(n^2)","O(n^3)"],a:2,e:"Every one of the n^2 elements must be moved to its new position."},
{q:"Finding the single missing number in an array containing 1 to n (one number missing) can be done in O(n) time using:",o:["Sorting first","XOR or the sum formula","A binary search tree","Recursion with memoization"],a:1,e:"Comparing the expected sum/XOR of 1..n against the actual array total reveals the missing value."},
{q:"Finding the kth largest element in an unsorted array by sorting first takes:",o:["O(n)","O(n log n)","O(k)","O(n^2) always"],a:1,e:"Sorting the array dominates the cost at O(n log n), after which the kth largest is a direct lookup."},
{q:"Binary search on a rotated sorted array (with no duplicates) can still be performed in:",o:["O(n)","O(log n)","O(n log n)","O(n^2)"],a:1,e:"A modified binary search identifies which half is properly sorted and narrows the search accordingly."},
{q:"What is the primary trade-off when choosing an array over a linked list for a dataset with frequent middle insertions?",o:["Arrays are always slower for everything","Arrays offer fast indexed access but slow middle insertion/deletion","Arrays use more memory per element always","There is no trade-off"],a:1,e:"Arrays trade off insertion/deletion cost for constant-time random access."}
 ]},
 linkedlist:{name:"Linked Lists", qs:[
  {q:"Inserting a node at the head of a singly linked list takes:",o:["O(1)","O(n)","O(log n)","O(n^2)"],a:0,e:"You just create a node and repoint the head — no traversal needed."},
  {q:"Accessing the nth element of a singly linked list takes:",o:["O(1)","O(n)","O(log n)","O(1) amortized"],a:1,e:"There's no direct indexing, so you must walk from the head."},
  {q:"Floyd's cycle detection algorithm is also known as:",o:["Binary search","Tortoise and Hare","Union-Find","Two Sum"],a:1,e:"A slow and a fast pointer move at different speeds; they meet if a cycle exists."},
  {q:"Reversing a singly linked list iteratively takes:",o:["O(1)","O(log n)","O(n)","O(n^2)"],a:2,e:"Each node's next pointer is redirected once as you walk the list."},
  {q:"A doubly linked list node contains pointers to:",o:["Only the next node","Only the previous node","Both next and previous nodes","The head and tail only"],a:2,e:"That's what lets you traverse in both directions."},
  {q:"Which is TRUE about a circular linked list?",o:["It has no head node","The last node points back to the first node","It cannot be traversed","It only allows single elements"],a:1,e:"The tail's next pointer loops back to the head instead of being null."},
  {q:"Recursive reversal of a linked list uses extra space of:",o:["O(1)","O(n) due to the call stack","O(log n)","O(n^2)"],a:1,e:"Each recursive call adds a stack frame, giving linear auxiliary space."},

 stacks_queues:{name:"Stacks & Queues", qs:[

{q:"To find the median of an unsorted array in average-case O(n) time, you can use:",o:["Merge Sort","Quickselect","Bubble Sort","Binary search directly"],a:1,e:"Quickselect is a partition-based algorithm related to Quick Sort, but only recurses into one side."},
{q:"The worst-case time complexity of Quickselect is:",o:["O(n)","O(n log n)","O(n^2)","O(log n)"],a:2,e:"Poor pivot choices can degrade it to quadratic time, similar to Quick Sort's worst case."},
{q:"Timsort, used by Python and Java, is a hybrid algorithm combining:",o:["Quick Sort and Heap Sort","Insertion Sort and Merge Sort","Bubble Sort and Selection Sort","Counting Sort and Radix Sort"],a:1,e:"It uses insertion sort for small runs and merge sort to combine them efficiently."},
{q:"Which search algorithm works on unsorted data with O(n) time complexity?",o:["Binary search","Linear search","Ternary search","Interpolation search"],a:1,e:"Without any ordering assumption, every element may need to be checked."},
{q:"The 'stability' of a sorting algorithm refers to:",o:["How fast it runs","Whether it preserves the relative order of equal elements","Whether it uses recursion","Whether it works on any data type"],a:1,e:"Stable sorts guarantee that equal elements retain their original relative ordering."},
{q:"Which of these sorting algorithms is typically NOT stable in its standard implementation?",o:["Merge Sort","Insertion Sort","Quick Sort","Bubble Sort"],a:2,e:"Quick Sort's partitioning can reorder equal elements relative to each other."},
{q:"The space complexity of an iterative binary search implementation is:",o:["O(1)","O(log n)","O(n)","O(n log n)"],a:0,e:"Iterative binary search only needs a constant number of variables regardless of input size."},
{q:"The space complexity of a recursive binary search implementation is:",o:["O(1)","O(log n) due to the call stack","O(n)","O(n log n)"],a:1,e:"Each recursive call adds a stack frame, and the recursion depth is proportional to log n."},
{q:"Finding the first and last occurrence of a target value in a sorted array with duplicates can be done in:",o:["O(n)","O(log n) using modified binary search","O(n log n)","O(1)"],a:1,e:"Two separate binary searches, biased towards the leftmost and rightmost matches, achieve this."},
{q:"Sorting an array of n integers known to lie within a small fixed range can be done in:",o:["O(n log n) only","O(n) using Counting Sort","O(n^2) minimum","O(2^n)"],a:1,e:"Counting Sort exploits the bounded range to avoid comparisons entirely."},
{q:"External sorting, used when data is too large to fit in memory, commonly relies on:",o:["In-place Quick Sort","External merge sort, with disk-based merging of sorted chunks","Bubble Sort with paging","Hash-based sorting"],a:1,e:"Data is split into memory-sized sorted runs on disk, then merged together."}
 ]},
 dp_complexity:{name:"DP & Complexity", qs:[
  {q:"Dynamic programming mainly helps avoid:",o:["Recursion entirely","Recomputing overlapping subproblems","Using arrays","Sorting"],a:1,e:"DP stores results of subproblems so they aren't solved repeatedly."},
  {q:"Computing the nth Fibonacci number with memoization takes:",o:["O(2^n)","O(n)","O(log n)","O(n^2)"],a:1,e:"Each of the n subproblems is solved once and cached."},
  {q:"Big-O notation primarily describes:",o:["Exact runtime in seconds","Upper bound on growth rate as input grows","Memory address usage","Compiler optimization level"],a:1,e:"It characterizes how runtime/space scales asymptotically with input size."},
  {q:"O(1) refers to:",o:["Linear time","Constant time, independent of input size","Logarithmic time","Exponential time"],a:1,e:"The operation takes the same time regardless of how large the input is."},
  {q:"Which DP technique builds a table bottom-up, from smaller to larger subproblems?",o:["Memoization","Tabulation","Backtracking","Greedy"],a:1,e:"Tabulation fills a table iteratively rather than recursing top-down."},
  {q:"The 0/1 Knapsack problem is classically solved using:",o:["Dynamic Programming","Binary Search","Depth-First Search","Bubble Sort"],a:0,e:"It has overlapping subproblems and optimal substructure, ideal for DP."},
  {q:"Which of these has the fastest growth rate as n increases?",o:["O(n log n)","O(n^2)","O(2^n)","O(log n)"],a:2,e:"Exponential growth outpaces polynomial growth for large n."},
  {q:"Memoization is best described as:",o:["A bottom-up table-filling approach","A top-down approach that caches computed results","A sorting technique","A graph traversal method"],a:1,e:"It's recursion plus a cache to avoid recomputing the same calls."}
 ,
{q:"The Longest Increasing Subsequence (LIS) problem can be solved in O(n log n) time using:",o:["Brute-force recursion","Binary search combined with a patience-sorting-style tails array","Bubble sort","Union-Find"],a:1,e:"Maintaining the smallest possible tail for each subsequence length allows binary search to find insertion points."},
{q:"The Longest Common Subsequence (LCS) of two strings of length m and n has DP time complexity:",o:["O(m+n)","O(m*n)","O(m^2 * n^2)","O(log(m*n))"],a:1,e:"A 2D table indexed by positions in both strings is filled in, giving O(m*n) time and space."},
{q:"The Edit Distance (Levenshtein distance) problem is solved using DP with time complexity:",o:["O(m+n)","O(m*n)","O(2^(m+n))","O(log(m*n))"],a:1,e:"Each cell in the DP table represents the min edit operations for prefixes of both strings."},
{q:"The classic minimum-coins coin change problem is typically solved using:",o:["Greedy algorithms only, always correct","Dynamic programming","Binary search","Depth-first search only"],a:1,e:"DP guarantees the optimal answer even when a greedy approach would fail for certain coin denominations."},
{q:"A greedy algorithm differs from dynamic programming in that it:",o:["Always guarantees a globally optimal solution","Makes locally optimal choices without reconsidering, and doesn't always yield a global optimum","Never runs in polynomial time","Requires overlapping subproblems"],a:1,e:"Greedy works only when the problem has the greedy-choice property; otherwise DP is needed for correctness."},
{q:"The matrix chain multiplication problem uses DP to:",o:["Sort matrices by size","Minimize the total number of scalar multiplications needed","Multiply matrices faster than standard multiplication","Find the determinant"],a:1,e:"It finds the optimal parenthesization to reduce total multiplication operations."},
{q:"'Optimal substructure' in the context of DP means:",o:["A problem has no valid solution","An optimal overall solution can be constructed from optimal solutions of its subproblems","Every subproblem is unique","Subproblems must be solved in parallel"],a:1,e:"This property is required for both DP and greedy strategies to be applicable."},
{q:"'Overlapping subproblems' means:",o:["Every subproblem is solved exactly once naturally","The same subproblems recur multiple times in a naive recursive solution","Subproblems never share any structure","The problem has no recursive structure"],a:1,e:"DP exploits this by caching results instead of recomputing them."},
{q:"The subset sum problem (does a subset sum to a target value) can be solved via DP in:",o:["O(n)","O(n * target)","O(2^n) always, no better option","O(log n)"],a:1,e:"A DP table indexed by item count and target sum achieves pseudo-polynomial time."},
{q:"Reducing a 2D DP table to a 1D array (space optimization) is possible when:",o:["The problem has no recurrence relation","The current row/state only depends on the immediately preceding row/state","The array must stay 2D always","Recursion is used instead of iteration"],a:1,e:"If only the previous row matters, you can overwrite it in place instead of storing the full table."},
{q:"The naive recursive computation of the nth Fibonacci number (no memoization) runs in:",o:["O(n)","O(n^2)","O(2^n)","O(log n)"],a:2,e:"Each call branches into two more calls, leading to exponential growth without caching."},
{q:"Which is a classic example of 'DP on trees'?",o:["Binary search in a BST","Maximum path sum in a binary tree, or the 'house robber' problem on a tree","Depth-first traversal only","Sorting a tree's values"],a:1,e:"These problems compute optimal values bottom-up across subtrees."},
{q:"The Rod Cutting problem uses DP to:",o:["Sort rod lengths","Maximize total profit by choosing optimal cut lengths","Minimize the number of cuts always","Find the shortest rod"],a:1,e:"It considers all possible first-cut lengths and recursively solves the remaining rod optimally."},
{q:"An algorithm with O(1) space complexity means:",o:["It uses no memory at all","It uses a constant amount of extra memory, regardless of input size","It uses memory proportional to n","It's always the fastest algorithm"],a:1,e:"The extra memory used doesn't grow as the input size increases."},
{q:"'Amortized time complexity' refers to:",o:["The worst possible time for a single operation","The average time per operation across a sequence, even if some individual operations are costly","The best-case time only","A synonym for average-case complexity in random inputs"],a:1,e:"Dynamic array resizing is a classic example: most appends are O(1), occasional resizes are O(n), averaging to O(1)."},
{q:"O(n!) time complexity commonly arises in problems involving:",o:["Binary search","Generating all permutations of n elements","Simple array traversal","Hashing"],a:1,e:"There are n! possible orderings of n distinct elements, and generating each takes factorial time."},
{q:"The Master Theorem is used to:",o:["Prove NP-completeness","Solve recurrence relations that arise from divide-and-conquer algorithms","Balance binary search trees","Design hash functions"],a:1,e:"It provides a quick way to determine the asymptotic complexity of common recurrence forms."},
{q:"The recurrence T(n) = 2T(n/2) + O(n) solves to:",o:["O(n)","O(n log n)","O(n^2)","O(log n)"],a:1,e:"This is the classic Merge Sort recurrence, solved via the Master Theorem."},
{q:"Which complexity grows more slowly as n increases: O(log n) or O(sqrt(n))?",o:["O(sqrt(n))","O(log n)","They grow identically","Neither ever terminates"],a:1,e:"Logarithmic growth is slower than any positive power of n, including the square root."},
{q:"The longest palindromic substring of a string of length n can be solved with DP in:",o:["O(n)","O(n^2)","O(n^3)","O(2^n)"],a:1,e:"A 2D table tracks whether substrings are palindromes, filled in quadratic time."},
{q:"Backtracking differs from dynamic programming mainly in that it:",o:["Always caches subproblem results","Explores all possibilities, typically without caching overlapping subproblem results","Cannot be used for optimization problems","Is always faster than DP"],a:1,e:"Backtracking systematically tries and undoes choices, while DP specifically avoids redundant recomputation via caching."},
{q:"The classic 'egg drop puzzle' (minimizing worst-case trials to find the critical floor) is solved using:",o:["Greedy algorithms","Dynamic programming","Binary search alone, no DP needed","Simple linear scanning"],a:1,e:"It's formulated as a DP over the number of eggs and floors remaining."},
{q:"While time complexity measures how runtime scales with input size, space complexity measures:",o:["How accurate the algorithm is","How memory usage scales with input size","How many lines of code are needed","The number of test cases required"],a:1,e:"Space complexity accounts for all memory used by the algorithm, including auxiliary structures."},
{q:"A 2D DP table for the 0/1 Knapsack problem with n items and capacity W has time and space complexity:",o:["O(n+W)","O(n*W)","O(n log W)","O(2^n)"],a:1,e:"Each of the n items is considered against each of the W possible capacities."},
{q:"Which technique reduces the 0/1 Knapsack DP space complexity from O(n*W) to O(W)?",o:["Using recursion instead of iteration","Using a 1D array and updating it in reverse order per item","Sorting items by weight first","Using a hash map instead of an array"],a:1,e:"Iterating capacities in reverse prevents an item from being counted more than once within the same pass."},
{q:"Computing the Fibonacci sequence iteratively (bottom-up), tracking only the last two values, runs in:",o:["O(n) time, O(n) space","O(n) time, O(1) space","O(2^n) time, O(1) space","O(log n) time, O(1) space"],a:1,e:"Only two variables need to be tracked and updated as you iterate forward."}
 ]}
}},
oop:{name:"Object-Oriented Programming", accent:"#b28dff", snippet:"class Animal:", topics:{
 basics:{name:"Core Concepts", qs:[
  {q:"A class is best described as:",o:["An instance of an object","A blueprint for creating objects","A loop construct","A database table"],a:1,e:"A class defines the structure and behavior that its objects will have."},
  {q:"An object is:",o:["A blueprint","An instance of a class","A type of loop","A function only"],a:1,e:"Objects are concrete instances created from a class definition."},
  {q:"In most OOP languages, 'this' or 'self' refers to:",o:["The parent class","The current instance of the class","A static variable","The compiler"],a:1,e:"It lets a method refer to the specific object it was called on."},
  {q:"A constructor is:",o:["A method that destroys an object","A special method invoked when an object is created","A loop that runs once","A built-in sorting function"],a:1,e:"Constructors initialize an object's state right after it's created."},
  {q:"Which of these is NOT one of the four pillars of OOP?",o:["Encapsulation","Inheritance","Compilation","Polymorphism"],a:2,e:"The four pillars are encapsulation, inheritance, polymorphism, and abstraction — compilation isn't one of them."},
  {q:"A function defined inside a class is typically called:",o:["A member function / method","A global function","A macro","A pointer"],a:0,e:"Functions belonging to a class are called methods or member functions."},
  {q:"In Java, an object is created using the keyword:",o:["make","new","create","object"],a:1,e:"'new' allocates memory and calls the constructor."},
  {q:"Attributes of a class are also referred to as:",o:["Member variables / fields","Static methods","Interfaces","Loops"],a:0,e:"They store the data associated with each object."}
 ,
{q:"Which keyword is used to define a class in Python?",o:["def","class","object","struct"],a:1,e:"The 'class' keyword begins a class definition in Python."},
{q:"A class variable, shared across all instances, differs from an instance variable in that:",o:["It's unique to each object","It's shared by all objects of the class unless overridden","It cannot be accessed by instances","It must be private"],a:1,e:"Class variables live on the class itself, so all instances see the same value unless an instance shadows it."},
{q:"The process of creating an object from a class is called:",o:["Inheritance","Instantiation","Abstraction","Polymorphism"],a:1,e:"Instantiation produces a concrete object following the class's blueprint."},
{q:"Which of these best describes a method in a class?",o:["A variable storing data","A function defined within the class body","A separate standalone script","A type of loop"],a:1,e:"Methods define the behavior objects of that class can perform."},
{q:"Which of these is an example of a 'has-a' relationship?",o:["A Car class containing an Engine object","A Dog class inheriting from Animal","A function calling itself","A static method"],a:0,e:"Composition ('has-a') means one object contains another as a part, unlike inheritance ('is-a')."},
{q:"In UML class diagrams, a class is typically represented as:",o:["A circle","A box divided into name, attributes, and methods sections","An arrow","A diamond"],a:1,e:"This three-part box is the standard UML notation for classes."},
{q:"In Python, which module helps formally define abstract classes that cannot be instantiated directly?",o:["abc","os","sys","collections"],a:0,e:"The abc module provides ABCMeta and the @abstractmethod decorator."},
{q:"A namespace in OOP primarily helps to:",o:["Speed up execution","Avoid naming conflicts between identifiers","Compress code","Enforce type checking"],a:1,e:"Namespaces scope names so identical names in different contexts don't collide."},
{q:"Which best describes the 'state' of an object?",o:["The methods it can call","The values of its attributes at a given time","Its class name","Its memory address only"],a:1,e:"State refers to the current data held by an object's attributes."},
{q:"Which best describes the 'behavior' of an object?",o:["Its attribute values","The methods that define what actions it can perform","Its class hierarchy only","Its memory footprint"],a:1,e:"Behavior is expressed through the methods an object exposes."},
{q:"A class method (decorated with @classmethod in Python) can be called:",o:["Only after creating an instance","On the class itself, without needing an instance","Only from within the same module","Never, it's purely theoretical"],a:1,e:"Classmethods receive the class (cls) rather than an instance, so they can be invoked directly on the class."},
{q:"What is the primary purpose of a copy constructor?",o:["To delete an object","To create a new object as a copy of an existing one","To convert an object to a string","To compare two objects"],a:1,e:"It initializes a new object using another object's existing state."}
 ]},
 inheritance:{name:"Inheritance", qs:[
  {q:"Inheritance allows a class to:",o:["Hide its own methods","Acquire properties and methods of another class","Run faster","Avoid using objects"],a:1,e:"A subclass reuses and extends the behavior of its parent class."},
  {q:"A class that inherits from another is called:",o:["A base class","A subclass / derived class","An interface","A static class"],a:1,e:"It's also called a child or derived class."},
  {q:"Multiple inheritance means:",o:["A class has multiple constructors","A class inherits from more than one base class","A class has multiple objects","A method is called multiple times"],a:1,e:"The subclass combines features from several parent classes."},
  {q:"In single inheritance, a class inherits from:",o:["Only one parent class","Two parent classes","No parent class","Itself"],a:0,e:"Single inheritance restricts a class to exactly one direct parent."},
  {q:"In Python, inheritance is declared as:",o:["class Child extends Parent:","class Child(Parent):","class Child : Parent","class Child -> Parent"],a:1,e:"Python uses parentheses after the class name to list parent classes."},
  {q:"Method overriding occurs when:",o:["A subclass has more methods than its parent","A subclass provides its own implementation of a parent's method","Two methods share a name in unrelated classes","A method is deleted"],a:1,e:"The subclass replaces the inherited method's behavior with its own version."},
  {q:"super() in Python is typically used to:",o:["Delete the parent class","Call the parent class's methods","Create a new object","End the program"],a:1,e:"It gives access to the parent class's methods and constructor from the subclass."},
  {q:"Which language does NOT support multiple inheritance through classes directly?",o:["Python","C++","Java","Java allows it via multiple interfaces"],a:2,e:"Java disallows multiple class inheritance to avoid ambiguity, though it allows implementing multiple interfaces."}
 ,
{q:"A hierarchy where class C inherits from class B, which itself inherits from class A, is called:",o:["Hierarchical inheritance","Multilevel inheritance","Multiple inheritance","Hybrid inheritance"],a:1,e:"Inheritance forms a chain across multiple levels: A to B to C."},
{q:"Hierarchical inheritance means:",o:["One subclass inherits from multiple base classes","Multiple subclasses inherit from a single base class","A class inherits from itself","There is no inheritance at all"],a:1,e:"Several distinct subclasses share the same parent class."},
{q:"Hybrid inheritance is best described as:",o:["A single form of inheritance only","A combination of two or more types of inheritance","Inheritance with no base class","Inheritance restricted to interfaces"],a:1,e:"It mixes patterns like multilevel and multiple inheritance together."},
{q:"The 'diamond problem' arises in:",o:["Single inheritance","Multiple inheritance, when two parent classes share a common ancestor","Hierarchical inheritance only","Interfaces with no methods"],a:1,e:"Ambiguity occurs over which parent's version of an inherited member should be used."},
{q:"In Java, inheritance between classes is declared using the keyword:",o:["inherits","extends","implements","derives"],a:1,e:"'extends' is used for class inheritance; 'implements' is used for interfaces."},
{q:"In C++, the access specifier used when inheriting (public/protected/private) controls:",o:["Whether the derived class can compile","How base class members' access levels are adjusted in the derived class","The size of the derived class","Nothing meaningful"],a:1,e:"For example, private inheritance makes even public base members private in the derived class."},
{q:"If a subclass constructor doesn't explicitly call a parent constructor, what typically happens (in languages like Java)?",o:["A compile error always occurs","The parent's default (no-argument) constructor is implicitly called","The subclass has no constructor at all","The object is left uninitialized"],a:1,e:"Implicit calls to the parent's no-arg constructor happen automatically unless overridden."},
{q:"Which of these is generally TRUE about private members and inheritance?",o:["Private members of a base class are directly accessible in every subclass","Private members of a base class are generally not directly accessible in the subclass","Private members are always inherited as public","Inheritance removes all access restrictions"],a:1,e:"Private members remain hidden from subclasses; protected/public members are what get inherited for direct access."},
{q:"Interface inheritance differs from class inheritance mainly because it:",o:["Always provides full implementation","Traditionally defines a contract (method signatures) without implementation","Cannot be inherited multiple times","Requires no method declarations"],a:1,e:"Classes implementing an interface must supply their own implementations of its declared methods."},
{q:"The 'is-a' relationship enforced by inheritance means:",o:["A subclass object can be treated as an instance of its parent class","A subclass has no relation to its parent","Objects of the same class are identical","Two unrelated classes share behavior"],a:0,e:"Since a subclass extends the parent, it can be used wherever the parent type is expected."},
{q:"Method 'shadowing' differs from method 'overriding' in that:",o:["They are exactly the same concept","Shadowing hides a member like a static field or method, while overriding replaces instance method behavior polymorphically","Overriding only applies to variables","Shadowing requires abstract classes"],a:1,e:"Overriding participates in dynamic dispatch; shadowing (e.g. of static members) is resolved statically."},
{q:"In Python, calling a parent class's __init__ manually without using super() is done via:",o:["parent.__init__(self)","ParentClass.__init__(self, ...)","self.parent()","super.__init__()"],a:1,e:"Explicitly referencing the parent class and passing self lets you invoke its constructor directly."}
 ]},
 polymorphism:{name:"Polymorphism", qs:[
  {q:"Polymorphism generally means:",o:["One class, no methods","One interface, many implementations","Only one object per class","Deleting inherited methods"],a:1,e:"The same operation can behave differently depending on the object it acts on."},
  {q:"Method overloading is an example of:",o:["Runtime polymorphism","Compile-time polymorphism","Encapsulation","Abstraction"],a:1,e:"The compiler resolves which overloaded method to call based on argument types/counts."},
  {q:"Method overriding is an example of:",o:["Compile-time polymorphism","Runtime polymorphism","Static binding","Encapsulation"],a:1,e:"The actual method called is determined at runtime based on the object's real type."},
  {q:"Operator overloading is natively supported in:",o:["Java only","Python and C++","C only","None of these"],a:1,e:"Both Python (via dunder methods) and C++ let you redefine operator behavior for custom types."},
  {q:"Runtime polymorphism in Java is enabled through:",o:["Static methods","Dynamic method dispatch","Final variables","Constructors"],a:1,e:"The JVM decides at runtime which overridden method implementation to invoke."},
  {q:"'Duck typing' is a concept most associated with:",o:["Java","C","Python","C++"],a:2,e:"Python cares about an object's behavior/methods rather than its explicit type."},
  {q:"Overloaded methods differ from each other by:",o:["Return type only","Number and/or type of parameters","Access modifier only","Method body length"],a:1,e:"Overload resolution is based on the method's parameter signature."},
  {q:"Virtual functions in C++ primarily enable:",o:["Faster compilation","Runtime polymorphism","Memory deallocation","Multiple inheritance"],a:1,e:"They let a base class pointer/reference call the derived class's overridden version."}
 ,
{q:"Ad-hoc polymorphism refers to:",o:["A single function that only ever behaves one way","Functions or operators behaving differently depending on the types they're applied to (like overloading)","Runtime-only polymorphism","Polymorphism that requires inheritance"],a:1,e:"This is typically achieved through operator or function overloading resolved per type."},
{q:"Parametric polymorphism refers to:",o:["Writing code that works generically across many types, like generics or templates","Overloading operators only","Runtime method dispatch","Multiple inheritance"],a:0,e:"Generic containers and functions that work with any type exemplify parametric polymorphism."},
{q:"In C++, which keyword must be applied to a base class method to enable proper overriding and dynamic dispatch?",o:["static","virtual","inline","const"],a:1,e:"Marking a method virtual allows derived class overrides to be resolved at runtime via a vtable."},
{q:"A pure virtual function in C++ (declared with = 0) makes the class:",o:["Instantiable normally","Abstract, unable to be instantiated directly","Immutable","Final, preventing further inheritance"],a:1,e:"Any class with at least one pure virtual function becomes an abstract base class."},
{q:"Coercion polymorphism refers to:",o:["Manual type casting only","Automatic type conversion (like int to float) that allows an operation to succeed","Runtime exceptions","Static-only method resolution"],a:1,e:"The compiler implicitly converts one type to another so an operation involving mixed types can work."},
{q:"In Python, overloading the '+' operator for custom objects is done by implementing:",o:["__plus__","__add__","__sum__","__concat__"],a:1,e:"The __add__ dunder method defines behavior for the '+' operator."},
{q:"Overriding a method in a subclass typically requires:",o:["A different method name than the parent","The same method signature (name and parameters) as in the parent class","No parameters at all","The parent method to be private"],a:1,e:"Matching signatures ensure the override is correctly recognized and dispatched at runtime."},
{q:"Which of these enables polymorphic behavior through a shared interface?",o:["A final class with no children","An abstract base class or interface implemented by multiple subclasses","A single concrete class with no relationships","A global function"],a:1,e:"Multiple classes implementing the same interface can be used interchangeably by client code."},
{q:"Static (early) binding is resolved:",o:["At runtime","At compile time","Only in interpreted languages","Randomly"],a:1,e:"The compiler determines which method to call based on the declared type at compile time."},
{q:"Dynamic (late) binding is resolved:",o:["At compile time","At runtime, based on the actual object type","Never, it's a myth","Only for static methods"],a:1,e:"The actual object's type determines which overridden method implementation executes."},
{q:"In Java, overloaded methods are distinguished from one another by:",o:["Their return type alone","Their parameter list (number and/or types), not return type alone","Their access modifier only","Their method name being different"],a:1,e:"Two methods with the same name must differ in parameters to be considered overloads."},
{q:"A key practical benefit of polymorphism is:",o:["It makes code run faster in every case","Writing more generic, reusable code that works across multiple types","It removes the need for interfaces","It eliminates all runtime errors"],a:1,e:"Client code can operate on a common interface/type without knowing the concrete implementation details."}
 ]},
 encapsulation_abstraction:{name:"Encapsulation & Abstraction", qs:[
  {q:"Encapsulation means:",o:["Bundling data and methods, restricting direct access","Hiding a class from the compiler","Having no methods","Using only static variables"],a:0,e:"It packages data with the methods that operate on it and controls external access."},
  {q:"Abstraction focuses on:",o:["Showing all implementation details","Hiding implementation details, showing only essentials","Removing all classes","Making everything public"],a:1,e:"Abstraction exposes what an object does, not how it does it."},
  {q:"In Python, a single leading underscore (_var) conventionally suggests:",o:["A constant","A protected/internal-use attribute","A public API","A syntax error"],a:1,e:"It's a convention signaling 'internal use', though not strictly enforced."},
  {q:"A double leading underscore (__var) in Python triggers:",o:["A syntax error","Name mangling","Automatic deletion","Nothing special"],a:1,e:"Python renames it internally to make accidental access/override from subclasses less likely."},
  {q:"An abstract class:",o:["Can always be instantiated directly","Cannot be instantiated directly","Has no methods at all","Must be a subclass of another abstract class"],a:1,e:"Abstract classes exist to be subclassed and completed, not instantiated on their own."},
  {q:"Getter and setter methods primarily support:",o:["Inheritance","Encapsulation","Polymorphism","Recursion"],a:1,e:"They control how internal data is read or modified from outside the class."},
  {q:"An interface in Java typically contains:",o:["Only private fields","Abstract methods (with optional default/static methods)","Only constructors","Compiled bytecode only"],a:1,e:"Interfaces declare method contracts that implementing classes must fulfill."},
  {q:"Which access modifier restricts access to only within the declaring class?",o:["public","protected","private","default"],a:2,e:"'private' members aren't visible outside their own class."}
 ,
{q:"Which of these best demonstrates abstraction in everyday life?",o:["Seeing all wiring inside a car dashboard","A car's steering wheel hides the underlying mechanical complexity of turning wheels","Reading a car's engine source code","Disassembling a car to drive it"],a:1,e:"You interact with a simple interface (the wheel) without needing to know the internal mechanism."},
{q:"In Java, the 'protected' access modifier allows access from:",o:["Only the exact same class","The same package and subclasses (even in different packages)","Anywhere in the program","Nowhere, it's the most restrictive"],a:1,e:"Protected sits between package-private and public in terms of visibility, extending access to subclasses."},
{q:"Which OOP principle most directly helps achieve data hiding?",o:["Inheritance","Encapsulation","Polymorphism","Composition"],a:1,e:"Encapsulation restricts direct access to internal state, often via private fields."},
{q:"An abstract method:",o:["Has a full implementation in its declaring class","Has no implementation in the class that declares it, and must be implemented by subclasses","Cannot be overridden","Is always static"],a:1,e:"Abstract methods define a required contract that concrete subclasses must fulfill."},
{q:"Which of the following is generally true about traditional interfaces in languages like Java (pre-default methods)?",o:["They contain instance fields with state","They cannot have instance state (fields) and only declare method signatures","They must be instantiated directly","They replace all classes"],a:1,e:"Interfaces traditionally define behavior contracts without holding object state themselves."},
{q:"The Facade design pattern is closely related to which OOP principle?",o:["Inheritance","Abstraction, by hiding subsystem complexity behind a simpler interface","Polymorphism only","Multiple inheritance"],a:1,e:"A facade provides a simplified interface, abstracting away complex subsystem interactions."},
{q:"Encapsulation is often implemented in practice by:",o:["Making all fields public","Making fields private and exposing controlled access via getter/setter methods","Avoiding classes altogether","Using only global variables"],a:1,e:"This controls how internal state can be read or modified from outside the class."},
{q:"Which of these is an example of breaking encapsulation?",o:["Using a getter method to read a value","Directly accessing and modifying a private field from outside its class","Calling a public method","Creating an object via a constructor"],a:1,e:"Bypassing the class's intended access controls violates the principle of encapsulation."},
{q:"An abstract class can contain:",o:["Only abstract methods, nothing else","Both abstract methods and fully implemented (concrete) methods","No methods at all","Only static methods"],a:1,e:"Abstract classes can provide shared implementation alongside methods that subclasses must define."},
{q:"Which Python language feature is used to formally declare abstract methods?",o:["The @staticmethod decorator","The abc module's @abstractmethod decorator","The @property decorator","The __slots__ attribute"],a:1,e:"Combined with ABCMeta or ABC as a base class, this enforces that subclasses implement the method."},
{q:"The main benefit of abstraction is:",o:["Increasing code complexity intentionally","Reducing complexity by exposing only relevant details to the user","Removing the need for testing","Making all data public"],a:1,e:"Users of a class interact with a simplified interface rather than internal implementation details."},
{q:"A 'contract' in OOP design typically refers to:",o:["A legal agreement between developers","An interface defining what methods a class must implement, without specifying how","A comment describing the code","A unit test suite"],a:1,e:"Implementing classes agree to fulfill the interface's method signatures."}
 ]},
 design_principles:{name:"Design Principles", qs:[
  {q:"In SOLID, the 'S' stands for:",o:["Static Responsibility","Single Responsibility Principle","Simple Reuse","Shared Resource"],a:1,e:"A class should have only one reason to change."},
  {q:"The Open/Closed Principle states that classes should be:",o:["Open for modification, closed for extension","Open for extension, closed for modification","Always public","Never subclassed"],a:1,e:"You should be able to add new behavior without altering existing, tested code."},
  {q:"The Liskov Substitution Principle means:",o:["Subclasses should be substitutable for their base classes","Classes should never inherit","Interfaces must be empty","Constructors must be private"],a:0,e:"Code using a base class should work correctly even when given a subclass instance."},
  {q:"The Interface Segregation Principle suggests:",o:["One giant interface for everything","Many small, specific interfaces over one large one","No interfaces at all","Interfaces should have private methods only"],a:1,e:"Clients shouldn't be forced to depend on methods they don't use."},
  {q:"The Dependency Inversion Principle means:",o:["Depend on concrete implementations directly","Depend on abstractions, not concrete implementations","Never use dependencies","Always use global variables"],a:1,e:"High-level modules should rely on interfaces/abstractions rather than specific implementations."},
  {q:"A destructor is called when:",o:["An object is created","An object is destroyed / goes out of scope","A class is defined","A method is overloaded"],a:1,e:"It handles cleanup right before an object's memory is reclaimed."},
  {q:"Composition represents which kind of relationship?",o:["'is-a'","'has-a'","'can-be'","'was-a'"],a:1,e:"Composition means an object contains/owns another object as a part."},
  {q:"Inheritance represents which kind of relationship?",o:["'has-a'","'is-a'","'uses-a'","'made-of'"],a:1,e:"A subclass 'is a' more specific version of its parent class."}
 ,
{q:"The Factory design pattern is primarily used for:",o:["Sorting objects","Creating objects without specifying their exact concrete class in client code","Destroying objects safely","Comparing two objects"],a:1,e:"A factory method encapsulates object creation logic, decoupling clients from concrete classes."},
{q:"The Singleton design pattern ensures:",o:["A class can have unlimited instances","A class has only one instance, with a global point of access","A class cannot be instantiated at all","Every object is unique automatically"],a:1,e:"It's used when exactly one shared instance (like a configuration manager) is needed."},
{q:"The Observer design pattern is used when:",o:["An object needs to hide its implementation","Multiple objects need to be notified automatically of state changes in another object","Two incompatible interfaces need to work together","An object needs multiple constructors"],a:1,e:"Subscribers (observers) register with a subject and get notified when its state changes."},
{q:"The Strategy design pattern allows:",o:["Only one algorithm to ever be used","Selecting an algorithm's behavior interchangeably at runtime","Classes to inherit from multiple parents","Objects to be immutable"],a:1,e:"Different strategy implementations can be swapped in without changing the client code that uses them."},
{q:"'Favor composition over inheritance' is a common OOP guideline because:",o:["Inheritance is always faster","Composition offers more flexibility and avoids fragile, deeply nested hierarchies","Composition requires less code always","Inheritance is deprecated in all languages"],a:1,e:"Composing behavior from smaller objects is often more adaptable than rigid inheritance chains."},
{q:"The Decorator design pattern is used to:",o:["Permanently modify a class's source code","Add behavior to individual objects dynamically without altering their class","Remove functionality from objects","Create a single global instance"],a:1,e:"Decorators wrap objects to layer on additional behavior at runtime."},
{q:"Coupling in software design refers to:",o:["How well a single module's responsibilities relate to each other","How dependent modules or classes are on one another","The number of classes in a program","The speed of compilation"],a:1,e:"Lower coupling generally makes systems easier to change and maintain."},
{q:"Cohesion in software design refers to:",o:["How dependent modules are on each other","How closely related and focused the responsibilities of a single module or class are","The total lines of code","The number of design patterns used"],a:1,e:"High cohesion means a class does one well-defined job."},
{q:"High cohesion and low coupling are generally considered:",o:["Undesirable qualities","Desirable qualities of good software design","Irrelevant to design quality","Only relevant for small projects"],a:1,e:"They lead to more maintainable, understandable, and flexible systems."},
{q:"The Adapter design pattern is used to:",o:["Speed up object creation","Make incompatible interfaces work together","Enforce a single instance","Hide all class details"],a:1,e:"An adapter translates one interface into another that client code expects."},
{q:"A code smell where a single class does far too much, violating the Single Responsibility Principle, is often called:",o:["A clean class","A 'God object' or 'God class'","A singleton","An interface segregation violation only"],a:1,e:"Such classes become hard to maintain because they mix many unrelated responsibilities."},
{q:"The Builder design pattern is especially useful for:",o:["Deleting complex objects","Constructing complex objects step by step, especially with many optional parameters","Comparing two objects for equality","Sorting a collection of objects"],a:1,e:"It separates the construction process from the final representation, improving readability for complex object creation."}
 ]}
}},
sql:{name:"SQL", accent:"#ffb454", snippet:"SELECT * FROM t;", topics:{
 select_filter:{name:"Queries & Filtering", qs:[
  {q:"Which clause filters rows BEFORE any grouping happens?",o:["HAVING","WHERE","GROUP BY","ORDER BY"],a:1,e:"WHERE filters individual rows before GROUP BY aggregates them."},
  {q:"Which clause filters groups AFTER GROUP BY has been applied?",o:["WHERE","HAVING","SELECT","FROM"],a:1,e:"HAVING filters based on aggregate results, which don't exist until after grouping."},
  {q:"SELECT DISTINCT is used to:",o:["Sort results","Remove duplicate rows from the result","Filter by a condition","Join two tables"],a:1,e:"DISTINCT collapses duplicate rows into one in the output."},
  {q:"To sort results in descending order, you write:",o:["ORDER BY col ASC","ORDER BY col DESC","SORT BY col DOWN","GROUP BY col DESC"],a:1,e:"DESC after ORDER BY sorts from highest to lowest."},
  {q:"The pattern LIKE '%ab%' matches:",o:["Strings starting with 'ab'","Strings ending with 'ab'","Any string containing 'ab' anywhere","Only the exact string 'ab'"],a:2,e:"The % wildcard on both sides matches any characters before and after 'ab'."},
  {q:"To limit the number of rows returned (in most databases), you use:",o:["TOP only","LIMIT","MAX ROWS","CAP"],a:1,e:"LIMIT restricts the result set size (SQL Server uses TOP instead)."},
  {q:"IS NULL is used because:",o:["= NULL works the same way","NULL can't be compared with = and needs IS NULL/IS NOT NULL","NULL is treated as 0","It only works with strings"],a:1,e:"NULL represents 'unknown', so equality comparisons don't apply to it."},
  {q:"BETWEEN 10 AND 20 selects values that are:",o:["Strictly greater than 10 and less than 20","Inclusive of both 10 and 20","Only equal to 10 or 20","Outside the 10-20 range"],a:1,e:"BETWEEN is inclusive of both boundary values."}
 ,
{q:"Which clause specifies which table(s) to retrieve data from?",o:["SELECT","FROM","WHERE","GROUP BY"],a:1,e:"FROM identifies the source table(s) the query operates on."},
{q:"The wildcard character '_' in a LIKE pattern matches:",o:["Zero or more characters","Exactly one character","Only digits","Only letters"],a:1,e:"Unlike '%', the underscore matches a single character position."},
{q:"To select all columns from a table, you use:",o:["SELECT ALL","SELECT *","SELECT COLUMNS","SELECT EVERY"],a:1,e:"The asterisk is shorthand for every column in the table(s) referenced."},
{q:"Which keyword combines multiple conditions where ALL must be true?",o:["OR","AND","NOT","XOR"],a:1,e:"AND requires every listed condition to hold for a row to be included."},
{q:"Which keyword combines multiple conditions where AT LEAST ONE must be true?",o:["AND","OR","NOT","ALL"],a:1,e:"OR includes a row if any of the specified conditions are satisfied."},
{q:"The NOT IN operator is used to:",o:["Include rows matching any value in a list","Exclude rows matching any value in a given list","Sort rows in reverse","Join two tables"],a:1,e:"It filters out rows whose value appears in the specified set."},
{q:"To alias a column in the result set, you use:",o:["ALIAS","AS","RENAME","RE"],a:1,e:"AS lets you give a column (or table) a temporary name in the query's output."},
{q:"In SQL's logical query processing order, which clause is conceptually evaluated first?",o:["SELECT","FROM","ORDER BY","HAVING"],a:1,e:"Although SELECT is written first, FROM (identifying source data) is logically processed before filtering and projection."},
{q:"When using ORDER BY with multiple columns, sorting happens:",o:["Only by the last column listed","Primarily by the first column, then by subsequent columns to break ties","Randomly among the listed columns","By column name alphabetically, ignoring the order listed"],a:1,e:"Later columns in the ORDER BY list only matter when earlier columns have equal values."}
 ]},
 joins:{name:"Joins", qs:[
  {q:"An INNER JOIN returns:",o:["All rows from both tables","Only rows that match in both tables","All rows from the left table only","No rows"],a:1,e:"Only rows with matching keys in both tables appear in the result."},
  {q:"A LEFT JOIN returns:",o:["Only matching rows","All rows from the left table, with NULLs where there's no right-table match","All rows from the right table only","The Cartesian product"],a:1,e:"Unmatched right-side columns are filled with NULL, but all left rows are kept."},
  {q:"A self join means:",o:["Joining a table with a different table","Joining a table with itself","A join with no ON clause","Deleting a table"],a:1,e:"The same table is referenced twice, usually with aliases, to compare its rows to each other."},
  {q:"A CROSS JOIN produces:",o:["Only matching rows","The Cartesian product of two tables","An empty result always","A single merged row"],a:1,e:"Every row from the first table is paired with every row from the second."},
  {q:"A FULL OUTER JOIN returns:",o:["Only matching rows","All rows from both tables, matched where possible, NULLs elsewhere","Only unmatched rows","Rows from neither table"],a:1,e:"It combines LEFT and RIGHT JOIN behavior, keeping everything from both sides."},
  {q:"When joining two tables, you typically match:",o:["A primary key with an unrelated column","A foreign key with a primary key","Two unrelated columns","Nothing — joins are automatic"],a:1,e:"The foreign key in one table usually references the primary key of another."},
  {q:"A RIGHT JOIN keeps all rows from:",o:["The left table","The right table","Neither table","Both tables equally, dropping unmatched rows"],a:1,e:"All rows from the right table are kept, with NULLs for unmatched left-side columns."},
  {q:"If a row in the left table has no match for an INNER JOIN, that row is:",o:["Included with NULLs","Excluded from the result","Duplicated","Converted to a default row"],a:1,e:"INNER JOIN only keeps rows where both sides have a match."}
 ,
{q:"A NATURAL JOIN automatically joins tables based on:",o:["Primary keys only","Columns with the same name in both tables","Row order","Table size"],a:1,e:"It implicitly matches on all identically named columns, which can be risky if unintended columns match."},
{q:"Which approach finds rows in one table that have NO match in another table?",o:["INNER JOIN only","LEFT JOIN combined with a WHERE clause checking the right table's column IS NULL","CROSS JOIN","UNION"],a:1,e:"Unmatched rows from a LEFT JOIN show NULL for the right table's columns, which you can then filter for."},
{q:"The ON clause in a JOIN specifies:",o:["Which columns to display","The condition used to match rows between the joined tables","The sort order","The table alias"],a:1,e:"It defines how rows from each table correspond to one another."},
{q:"A theta join uses:",o:["Only equality conditions","A comparison operator other than equality (like <, >, or !=)","No conditions at all","Only NULL comparisons"],a:1,e:"Theta joins generalize joins to any comparison operator, not just equals."},
{q:"An equi-join uses:",o:["Only equality conditions to match rows","Only inequality conditions","No join condition","Aggregate functions"],a:0,e:"Most common joins, like matching foreign keys to primary keys, are equi-joins."},
{q:"Joining three or more tables in a single query requires:",o:["A single JOIN clause covering all tables at once, with no chaining","Chaining multiple JOIN clauses together","Using UNION instead of JOIN","It's not possible in standard SQL"],a:1,e:"Each additional table is joined via its own JOIN...ON clause, building up the combined result."},
{q:"What can happen if you join two tables with an implicit comma-join syntax and forget a WHERE condition to match them?",o:["A syntax error is always raised","It may produce an unintended Cartesian product","The database automatically infers the correct join","Nothing happens; it returns zero rows"],a:1,e:"Without a matching condition, every row of one table pairs with every row of the other."},
{q:"The USING clause in a JOIN is essentially shorthand for:",o:["A CROSS JOIN","Joining on columns that share the same name in both tables","Sorting the joined result","A subquery"],a:1,e:"USING(column) matches rows where that column's value is equal in both tables, similar to NATURAL JOIN but explicit."},
{q:"Which join type returns rows even when there is no match on either side?",o:["INNER JOIN","LEFT JOIN only","RIGHT JOIN only","FULL OUTER JOIN"],a:3,e:"FULL OUTER JOIN preserves unmatched rows from both tables, filling in NULLs where needed."}
 ]},
 aggregation:{name:"Aggregation & Grouping", qs:[
  {q:"COUNT(*) returns:",o:["The sum of all values","The number of rows","The number of columns","The largest value"],a:1,e:"COUNT(*) counts every row, including ones with NULLs, in the group or table."},
  {q:"Which function returns the average of a numeric column?",o:["SUM()","AVG()","COUNT()","MAX()"],a:1,e:"AVG() computes the mean of the non-null values."},
  {q:"GROUP BY is used to:",o:["Sort rows alphabetically","Group rows sharing a value so aggregate functions apply per group","Remove duplicate columns","Join two tables"],a:1,e:"It partitions rows into groups so functions like SUM/COUNT/AVG apply within each group."},
  {q:"SUM() over a column:",o:["Includes NULLs as zero","Ignores NULL values","Throws an error on NULLs","Only works on text columns"],a:1,e:"Aggregate functions generally skip NULLs rather than treating them as zero."},
  {q:"Which aggregate function finds the largest value in a column?",o:["MIN()","MAX()","AVG()","COUNT()"],a:1,e:"MAX() returns the highest value present."},
  {q:"To count distinct values in a column, you use:",o:["COUNT(ALL column)","COUNT(DISTINCT column)","DISTINCT COUNT()","UNIQUE(column)"],a:1,e:"COUNT(DISTINCT column) counts only unique non-null values."},
  {q:"HAVING is used instead of WHERE when filtering on:",o:["Individual row values before grouping","Aggregate function results after grouping","Table names","Column data types"],a:1,e:"WHERE can't reference aggregates like SUM() because it runs before grouping happens."},
  {q:"MIN() returns:",o:["The smallest value in a column","The first row inserted","A random value","The number of rows"],a:0,e:"MIN() finds the lowest value among the selected rows."}
 ,
{q:"Can you directly use an aggregate function like SUM() inside a WHERE clause?",o:["Yes, always","No, aggregates in a filter condition require HAVING or a subquery","Only with GROUP BY present","Only for COUNT()"],a:1,e:"WHERE filters rows before aggregation happens, so aggregate results aren't yet available there."},
{q:"Using GROUP BY without any aggregate function in SELECT:",o:["Causes a syntax error always","Still groups rows into distinct combinations, though it's unusual without aggregates","Is identical to ORDER BY","Removes all duplicate rows automatically without grouping"],a:1,e:"It effectively behaves similarly to SELECT DISTINCT on the grouped columns."},
{q:"How does COUNT(column_name) differ from COUNT(*)?",o:["They always return the same result","COUNT(column_name) counts only non-null values in that column","COUNT(*) ignores NULLs while COUNT(column_name) doesn't","COUNT(column_name) is invalid syntax"],a:1,e:"COUNT(*) counts every row; COUNT(column) skips rows where that column is NULL."},
{q:"ROLLUP and CUBE are extensions of:",o:["JOIN","GROUP BY, used to generate subtotal and grand total rows","WHERE","ORDER BY"],a:1,e:"They automatically produce additional summary rows across combinations of grouped columns."},
{q:"When using GROUP BY, an ORDER BY clause with aggregates is typically applied:",o:["Before grouping happens","After GROUP BY and HAVING have been processed","Only before WHERE","It cannot be combined with GROUP BY"],a:1,e:"Sorting is one of the last steps, applied to the final aggregated result set."},
{q:"Which clause would you use to keep only groups having a COUNT greater than 5?",o:["WHERE COUNT(*) > 5","HAVING COUNT(*) > 5","GROUP BY COUNT(*) > 5","ORDER BY COUNT(*) > 5"],a:1,e:"HAVING filters on aggregate results computed after grouping."},
{q:"VARIANCE and STDDEV functions are examples of:",o:["String functions","Statistical aggregate functions","Date functions","Join conditions"],a:1,e:"They compute statistical measures of spread across a set of values."},
{q:"When using GROUP BY, every non-aggregated column in the SELECT list must generally:",o:["Be wrapped in an aggregate function regardless","Appear in the GROUP BY clause","Be renamed with AS","Be a primary key"],a:1,e:"Standard SQL requires non-aggregated selected columns to also be part of the grouping."},
{q:"Which SQL feature lets you compute a running total or moving average across ordered rows without collapsing them into groups?",o:["GROUP BY","Window (analytic) functions like SUM() OVER()","HAVING","UNION"],a:1,e:"Window functions perform calculations across a set of rows related to the current row, without reducing the row count."}
 ]},
 subqueries_setops:{name:"Subqueries & Set Ops", qs:[
  {q:"A subquery is:",o:["A query stored as a view permanently","A query nested inside another query","A syntax error in SQL","A type of join"],a:1,e:"Subqueries can appear in SELECT, WHERE, FROM, or HAVING clauses of an outer query."},
  {q:"EXISTS returns true when:",o:["The subquery returns zero rows","The subquery returns at least one row","The outer query has no rows","Always, regardless of the subquery"],a:1,e:"EXISTS is a boolean check for whether the subquery produces any matching rows."},
  {q:"UNION combines two result sets and:",o:["Keeps all duplicates","Removes duplicate rows (UNION ALL keeps them)","Requires different column counts","Only works on a single table"],a:1,e:"UNION deduplicates by default; UNION ALL preserves every row including duplicates."},
  {q:"The IN operator checks:",o:["If a value matches any value in a list or subquery result","If a string contains a substring","If a column is NULL","If two tables are joined"],a:0,e:"IN tests membership against a set of values."},
  {q:"A correlated subquery:",o:["Runs completely independently of the outer query","References columns from the outer query","Can never use WHERE","Always returns a single constant"],a:1,e:"It's re-evaluated for each row of the outer query because it depends on outer values."},
  {q:"INTERSECT returns:",o:["Rows from either query","Rows common to both queries","Rows only in the first query","All rows from both, duplicated"],a:1,e:"It keeps only the rows present in both result sets."},
  {q:"A subquery used inside the FROM clause is called:",o:["A correlated subquery","A derived table","A materialized view","A trigger"],a:1,e:"It acts like a temporary named table for the outer query to select from."},
  {q:"EXCEPT (or MINUS in some databases) returns:",o:["Rows in the first query but not the second","Rows in both queries","Rows in neither query","A Cartesian product"],a:0,e:"It subtracts the second result set's rows from the first's."}
 ,
{q:"A scalar subquery returns:",o:["Multiple rows and columns","A single value (one row, one column)","An entire table","Nothing, it's invalid"],a:1,e:"It's designed to be used wherever a single value is expected, like in a comparison."},
{q:"Can a subquery be used inside the SELECT clause of an outer query?",o:["No, never","Yes, if it returns a single value per outer row","Only in the FROM clause","Only with UNION"],a:1,e:"Such a subquery computes a derived value shown as an additional column."},
{q:"The ANY (or SOME) operator with a subquery returns true if:",o:["The condition holds for every value returned by the subquery","The condition holds for at least one value returned by the subquery","The subquery returns zero rows","It's used only with UPDATE statements"],a:1,e:"It's satisfied as long as one comparison against the subquery's results is true."},
